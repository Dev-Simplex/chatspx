# Otimizações para Chatwoot - 62GB RAM, 500 usuários
# HD (não SSD) - sem ajustes de random_page_cost
# Colocar em: /etc/postgresql/16/main/conf.d/performance.conf

# Memória principal do PostgreSQL (~25% da RAM)
shared_buffers = 16GB

# Dica para o planejador (~75% da RAM - não aloca memória)
effective_cache_size = 48GB

# Memória por operação de ordenação/hash (por query, por operação)
work_mem = 32MB

# Memória para VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 2GB

# Suaviza checkpoint - distribui I/O ao longo do tempo
checkpoint_completion_target = 0.9
