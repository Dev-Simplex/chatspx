name: Run Size Limit Check

on:
  pull_request:
    branches:
      - develop

# If two pushes happen within a short time in the same PR, cancel the run of the oldest push
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: pnpm
        run: pnpm install

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: setup env
        run: |
          cp .env.example .env

      - name: Run asset compile
        run: bundle exec rake assets:precompile
        env:
          RAILS_ENV: production

      # `size-limit` cobre o `sdk.js` nos dois orçamentos (40 KB crus / 15 KB
      # gzip — arbitragem A13). O glob `public/vite/assets/widget-*.js` saiu
      # daqui: ele media o chunk de entrada, não o grafo, e dependia do hash
      # do build.
      - name: Size Check (sdk.js)
        run: pnpm exec size-limit

      # Gate do bloco 0.5: percorre o manifest do Vite e soma o fecho
      # transitivo dos imports estáticos do widget, trava o Leaflet fora do
      # first-paint (por nome E por conteúdo — o Rollup inlina o Leaflet
      # quando o import vira estático, e aí a trava nominal fica cega) e
      # publica o delta em bytes do `sdk.js` contra a linha de base da §12
      # (29.014 B crus / 9.595 B gzip).
      #
      # ESTE PASSO NASCE VERMELHO E É PARA NASCER ASSIM. O grafo pesa
      # 422.599 B gzip contra o teto de 300 kB — 40,87% acima. O teto NÃO se
      # afrouxa para acomodar o número (PLANO-MESTRE §12.3); quem o derruba é
      # o bloco 1.08 (`content` próprio do Tailwind) e depois o 2.18 (JS eager
      # <= 150 KB gzip). Não desligue este passo nem suba o teto: a saída
      # separa DÍVIDA CONHECIDA de REGRESSÃO NOVA justamente para que o
      # vermelho permanente continue legível (risco R17).
      #
      # `if: always()` para que a saída do gate apareça mesmo quando o
      # `size-limit` acima já tiver falhado — dois gates, dois relatórios.
      - name: Widget graph size gate
        if: always()
        run: node scripts/widget-size.mjs
