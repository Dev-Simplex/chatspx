<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPX - CHAT | Painel</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg:#ffffff;--bg2:#fafafa;--bg3:#f5f5f5;--card:#ffffff;--border:rgba(0,0,0,.08);--border-h:rgba(0,0,0,.15);
      --t1:#0a0a0a;--t2:#525252;--t3:#a3a3a3;--t4:#d4d4d4;
      --brand:#2dc46f;--brand-l:#dcfce7;
      --on:#22c55e;--off:#ef4444;--warn:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;
      --on-s:#dcfce7;--off-s:#fef2f2;--warn-s:#fffbeb;--blue-s:#eff6ff;
      --on-t:#16a34a;--off-t:#dc2626;--warn-t:#d97706;--blue-t:#2563eb;
      --term-bg:#0a0a0a;
      --sh-h:0 2px 8px rgba(0,0,0,.04);
    }
    [data-theme="dark"] {
      --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--card:#141414;--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.14);
      --t1:#fafafa;--t2:#a3a3a3;--t3:#525252;--t4:#333;
      --brand-l:rgba(45,196,111,.1);
      --on-s:rgba(34,197,94,.1);--off-s:rgba(239,68,68,.1);--warn-s:rgba(245,158,11,.1);--blue-s:rgba(59,130,246,.1);
      --on-t:#4ade80;--off-t:#f87171;--warn-t:#fbbf24;--blue-t:#60a5fa;
      --term-bg:#050508;
      --sh-h:0 2px 8px rgba(0,0,0,.3);
    }
    *{margin:0;padding:0;box-sizing:border-box;font-variant-numeric:tabular-nums}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:14px;line-height:1.5}
    [x-cloak]{display:none!important}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--t4);border-radius:3px}
    a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
    *{transition-property:color,background-color,border-color,box-shadow,opacity,transform;transition-duration:.15s;transition-timing-function:cubic-bezier(.4,0,.2,1)}

    /* LOGIN */
    .login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
    .login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:380px}
    .login-logo{text-align:center;margin-bottom:32px}.login-logo img{height:44px;margin-bottom:14px}
    .login-logo h1{font-size:20px;font-weight:700;letter-spacing:-.3px}.login-logo p{color:var(--t3);font-size:12px;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
    .field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:500;color:var(--t3);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
    .field input,.field select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg2);color:var(--t1);outline:none}
    .field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;outline:none}
    .btn:active{transform:scale(.98)}
    .btn-primary{background:var(--t1);color:var(--bg);width:100%}.btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--border);padding:7px 14px;font-size:13px}.btn-ghost:hover{background:var(--bg3);border-color:var(--border-h)}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;font-weight:500}
    .btn-action{background:var(--bg3);color:var(--t2);border:1px solid var(--border)}.btn-action:hover{border-color:var(--border-h);background:var(--bg2)}
    .btn-cta{background:var(--brand);color:#fff;border-radius:8px;padding:10px 24px}.btn-cta:hover{filter:brightness(1.08)}.btn-cta:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .login-err{background:var(--off-s);color:var(--off-t);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

    /* NAV */
    .nav{border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--card);position:sticky;top:0;z-index:50}
    .nav-left{display:flex;align-items:center;gap:20px}.nav-left img{height:24px}.nav-left .title{font-size:15px;font-weight:600;letter-spacing:-.2px}
    .nav-right{display:flex;align-items:center;gap:4px}
    .nav-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--t3)}.nav-btn:hover{background:var(--bg3);color:var(--t1)}

    /* PAGE */
    .page{max-width:960px;margin:0 auto;padding:32px 24px}

    /* METRICS ROW */
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
    .met-card{border:1px solid var(--border);border-radius:12px;padding:16px 20px}
    .met-card:hover{border-color:var(--border-h);box-shadow:var(--sh-h)}
    .met-label{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .met-val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
    .met-sub{font-size:12px;color:var(--t3);margin-top:6px}

    /* VM LIST */
    .vm-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:32px}
    .vm-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
    .vm-item:hover{background:var(--bg2)}.vm-item+.vm-item{border-top:1px solid var(--border)}
    .vm-item.disabled{opacity:.4;cursor:default}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;position:relative}
    .dot.on{background:var(--on)}.dot.on::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:inherit;opacity:.3;animation:pulse-ring 2s ease-in-out infinite}
    .dot.off{background:var(--off)}.dot.none{background:var(--t4)}.dot.dep{background:var(--warn);animation:blink 1s infinite}
    .vm-info{flex:1;min-width:0}
    .vm-info h3{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}.vm-info .sub{font-size:12px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-top:1px}
    .tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--t3)}
    .tag-dep{background:var(--warn-s);color:var(--warn-t);display:flex;align-items:center;gap:3px}
    .vm-meta{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--t3);font-family:'JetBrains Mono',monospace}
    .vm-up{font-weight:600}.vm-up.g{color:var(--on-t)}.vm-up.m{color:var(--warn-t)}.vm-up.b{color:var(--off-t)}
    .chev{color:var(--t4);width:16px;height:16px}.chev.open{transform:rotate(180deg)}

    /* HEARTBEAT */
    .hb{display:flex;gap:1px;padding:0 20px 6px;align-items:flex-end}
    .hb-s{flex:1;height:20px;border-radius:1.5px;min-width:1.5px}
    .hb-s.on{background:var(--on);opacity:.5}.hb-s.on:hover{opacity:.8}.hb-s.off{background:var(--off);opacity:.5}.hb-s.off:hover{opacity:.8}.hb-s.none{background:var(--t4);opacity:.12}
    .hb-lbl{display:flex;justify-content:space-between;padding:0 20px 4px;font-size:10px;color:var(--t4)}

    /* EXPANDED */
    .vm-detail{padding:4px 20px 20px;border-top:1px solid var(--border)}
    .d-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:16px 0}
    .d-met .lbl{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
    .d-met .val{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px}.d-met .extra{font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace}
    .bar-bg{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}.bar-fill{height:100%;border-radius:2px;width:0}
    .sparkline{display:flex;align-items:flex-end;gap:1px;height:20px;margin-top:8px}.spark-b{flex:1;min-width:1px;border-radius:1px;opacity:.4}
    .d-info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
    .d-info-item{font-size:13px}.d-info-item .lbl{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:1px}.d-info-item a,.d-info-item strong{font-family:'JetBrains Mono',monospace;font-size:12px}
    .procs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .proc{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;background:var(--bg3);color:var(--t2)}
    .proc-d{width:6px;height:6px;border-radius:50%;flex-shrink:0}.proc-d.ok{background:var(--on)}.proc-d.ko{background:var(--off)}
    .actions{display:flex;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}

    /* DEPLOY BAR */
    .deploy-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .deploy-bar select{appearance:none;padding:9px 32px 9px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;background:var(--card) url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a3a3a3' fill='none' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat right 12px center;color:var(--t1);cursor:pointer;outline:none}

    /* TERMINAL */
    .term{background:var(--term-bg);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-top:16px;position:relative}
    .term-top{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
    .term-top .dots{display:flex;gap:5px}.term-top .dots span{width:8px;height:8px;border-radius:50%}.term-top .dots span:nth-child(1){background:#ff5f57}.term-top .dots span:nth-child(2){background:#febc2e}.term-top .dots span:nth-child(3){background:#28c840}
    .term-top .title{color:#737373;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
    .term-top button{background:none;border:none;color:#525252;cursor:pointer;padding:2px;border-radius:4px}.term-top button:hover{color:#fff;background:rgba(255,255,255,.08)}
    .term-body{padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;color:#d4d4d4;max-height:380px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
    .term-body .err{color:#f87171}.term-body .ok{color:#4ade80}
    .term-steps{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
    .term-step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
    .term-fab{position:absolute;bottom:12px;right:12px;display:flex;align-items:center;gap:5px;padding:5px 12px;background:#1a1a1a;color:#a3a3a3;border:1px solid rgba(255,255,255,.1);border-radius:20px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;z-index:5}
    .term-fab:hover{background:#262626;color:#fff}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:480px;width:92%;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:16px;font-weight:600;margin-bottom:8px}.modal p{color:var(--t2);font-size:13px;line-height:1.6}
    .modal-warn{background:var(--warn-s);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:12px 14px;margin:12px 0 16px;font-size:12px;color:var(--warn-t);line-height:1.5}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .vm-sel{max-height:240px;overflow-y:auto;margin:12px 0}
    .vm-sel-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;user-select:none}
    .vm-sel-item:hover{border-color:var(--brand);background:var(--bg2)}.vm-sel-item.sel{border-color:var(--brand);background:var(--brand-l)}.vm-sel-item.dis{opacity:.4;cursor:not-allowed}
    .cb{width:18px;height:18px;min-width:18px;border:1.5px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.cb.on{background:var(--brand);border-color:var(--brand)}.cb.on svg{color:#fff}

    /* TOAST */
    .toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;display:flex;align-items:center;gap:8px;border:1px solid;animation:slideIn .3s}
    .toast.success{background:var(--on-s);color:var(--on-t);border-color:rgba(34,197,94,.2)}.toast.error{background:var(--off-s);color:var(--off-t);border-color:rgba(239,68,68,.2)}

    @keyframes pulse-ring{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(2);opacity:0}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .spinner{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){.metrics{grid-template-columns:repeat(2,1fr)}.vm-meta{display:none}.d-metrics{grid-template-columns:1fr}.d-info{grid-template-columns:1fr}.actions{flex-direction:column}.nav{padding:0 14px}.page{padding:20px 14px}}
  </style>
</head>
<body>
<div x-data="app()" x-init="init()" x-cloak>

  <!-- LOGIN -->
  <template x-if="!auth">
    <div class="login-bg"><div class="login-box" style="animation:slideIn .4s">
      <div class="login-logo"><img src="/logo.svg" alt="SPX"><h1>SPX - CHAT</h1><p>Painel de Controle</p></div>
      <template x-if="loginErr"><div class="login-err"><i data-lucide="alert-circle" style="width:14px;height:14px"></i><span x-text="loginErr"></span></div></template>
      <form @submit.prevent="login()">
        <div class="field"><label>Usuario</label><input type="text" x-model="loginU" placeholder="admin" autocomplete="username" autofocus></div>
        <div class="field"><label>Senha</label><input type="password" x-model="loginP" placeholder="••••••" autocomplete="current-password"></div>
        <button type="submit" class="btn btn-primary" :disabled="loginL"><template x-if="loginL"><i data-lucide="loader-2" class="spinner" style="width:15px;height:15px"></i></template><span x-text="loginL?'Entrando...':'Entrar'"></span></button>
      </form>
    </div></div>
  </template>

  <!-- DASHBOARD -->
  <template x-if="auth"><div>
    <nav class="nav">
      <div class="nav-left"><img src="/logo.svg" alt=""><span class="title">SPX - CHAT</span></div>
      <div class="nav-right">
        <button class="nav-btn" @click="doRefresh()" title="Atualizar"><i data-lucide="refresh-cw" style="width:15px;height:15px" :class="{'spinner':refreshing}"></i></button>
        <button class="nav-btn" @click="toggleTheme()" :title="theme==='light'?'Modo escuro':'Modo claro'"><i :data-lucide="theme==='light'?'moon':'sun'" style="width:15px;height:15px"></i></button>
        <button class="nav-btn" @click="logout()" title="Sair"><i data-lucide="log-out" style="width:15px;height:15px"></i></button>
      </div>
    </nav>

    <div class="page">
      <!-- Metrics -->
      <div class="metrics">
        <div class="met-card"><div class="met-label">VMs Online</div><div class="met-val" :style="{color:onlineCount===totalActive?'var(--on-t)':'var(--off-t)'}" x-text="onlineCount+'/'+totalActive"></div><div class="met-sub" x-text="onlineCount===totalActive?'Todas operacionais':'Atencao necessaria'"></div></div>
        <div class="met-card"><div class="met-label">Deploys Ativos</div><div class="met-val" x-text="deployingCount"></div><div class="met-sub" x-text="deployingCount>0?'Em andamento...':'Nenhum ativo'"></div></div>
        <div class="met-card"><div class="met-label">Branch</div><div class="met-val" style="font-size:18px" x-text="branch"></div><div class="met-sub"><a :href="'https://github.com/'+github+'/tree/'+branch" target="_blank" style="font-size:11px">Ver no GitHub</a></div></div>
        <div class="met-card"><div class="met-label">Ultimo Check</div><div class="met-val" style="font-size:18px" x-text="lastCheck||'--:--'"></div><div class="met-sub">Atualiza a cada 60s</div></div>
      </div>

      <!-- VM List -->
      <div class="vm-list">
        <template x-for="(vm,i) in vms" :key="vm.id">
          <div>
            <div class="vm-item" :class="{'disabled':!vm.active}" @click="vm.active&&toggle(vm.id)">
              <span class="dot" :class="{'on':vm.status.online&&vm.active&&!vm.deploying,'off':!vm.status.online&&vm.active,'none':!vm.active,'dep':vm.deploying}"></span>
              <div class="vm-info">
                <h3><span x-text="vm.name"></span><span class="tag" x-text="vm.label"></span>
                  <template x-if="vm.deploying"><span class="tag tag-dep"><i data-lucide="loader-2" class="spinner" style="width:9px;height:9px"></i>Deploy</span></template>
                </h3>
                <div class="sub" x-text="vm.ip"></div>
              </div>
              <div class="vm-meta">
                <template x-if="vm.status.ping!=null&&vm.active"><span x-text="vm.status.ping+'ms'"></span></template>
                <template x-if="vm.uptimePercent!=null&&vm.active"><span class="vm-up" :class="{'g':vm.uptimePercent>=99,'m':vm.uptimePercent>=95&&vm.uptimePercent<99,'b':vm.uptimePercent<95}" x-text="vm.uptimePercent+'%'"></span></template>
                <template x-if="vm.status.commit&&vm.active"><a :href="'https://github.com/'+github+'/commit/'+vm.status.commit" target="_blank" @click.stop style="font-size:12px" x-text="vm.status.commit"></a></template>
              </div>
              <template x-if="vm.active"><i data-lucide="chevron-down" class="chev" :class="{'open':expanded.includes(vm.id)}"></i></template>
            </div>

            <template x-if="vm.active">
              <div><div class="hb"><template x-for="(hb,j) in padHB(vm.heartbeat)" :key="j"><div class="hb-s" :class="{'on':hb.online===true,'off':hb.online===false,'none':hb.online===null}" :title="hb.time?new Date(hb.time).toLocaleTimeString('pt-BR')+(hb.ping!=null?' — '+hb.ping+'ms':''):''"></div></template></div><div class="hb-lbl"><span>60 min</span><span>agora</span></div></div>
            </template>

            <template x-if="expanded.includes(vm.id)&&vm.status.online">
              <div class="vm-detail" style="animation:slideIn .2s">
                <div class="d-metrics">
                  <div class="d-met"><div class="lbl">CPU</div><div class="val" style="color:var(--blue)" x-text="vm.status.cpu+'%'"></div><div class="extra" x-text="'Load '+vm.status.load+' / '+vm.status.cpus+' CPUs'"></div><div class="bar-bg"><div class="bar-fill" :style="'width:'+vm.status.cpu+'%;background:var(--blue)'"></div></div>
                    <div class="sparkline"><template x-for="(h,j) in vm.heartbeat.slice(-30)" :key="j"><div class="spark-b" :style="'height:'+(h.cpu||0)*20/100+'px;background:var(--blue)'"></div></template></div>
                  </div>
                  <div class="d-met"><div class="lbl">Memoria</div><div class="val" style="color:var(--purple)" x-text="vm.status.ram+'%'"></div><div class="extra" x-text="fmtMem(vm.status.ramUsed)+' / '+fmtMem(vm.status.ramTotal)"></div><div class="bar-bg"><div class="bar-fill" :style="'width:'+vm.status.ram+'%;background:var(--purple)'"></div></div>
                    <div class="sparkline"><template x-for="(h,j) in vm.heartbeat.slice(-30)" :key="j"><div class="spark-b" :style="'height:'+(h.ram||0)*20/100+'px;background:var(--purple)'"></div></template></div>
                  </div>
                  <div class="d-met"><div class="lbl">Disco</div><div class="val" style="color:var(--warn)" x-text="vm.status.disk+'%'"></div><div class="extra" x-text="vm.status.diskUsed+'G / '+vm.status.diskTotal+'G'"></div><div class="bar-bg"><div class="bar-fill" :style="'width:'+vm.status.disk+'%;background:var(--warn)'"></div></div></div>
                </div>
                <div class="procs">
                  <div class="proc"><span class="proc-d" :class="vm.status.puma>0?'ok':'ko'"></span>Puma<span style="color:var(--t3);font-size:11px" x-text="'('+vm.status.puma+')'"></span></div>
                  <div class="proc"><span class="proc-d" :class="vm.status.sidekiq>0?'ok':'ko'"></span>Sidekiq<span style="color:var(--t3);font-size:11px" x-text="'('+vm.status.sidekiq+')'"></span></div>
                  <div class="proc"><span class="proc-d" :class="vm.status.chatwootStatusRaw==='active'?'ok':'ko'"></span>Servico<span style="color:var(--t3);font-size:11px" x-text="vm.status.chatwootStatus"></span></div>
                </div>
                <div class="d-info">
                  <div class="d-info-item"><div class="lbl">Branch</div><a :href="'https://github.com/'+github+'/tree/'+vm.status.branch" target="_blank" x-text="vm.status.branch||'-'"></a></div>
                  <div class="d-info-item"><div class="lbl">Tempo ativo</div><strong x-text="vm.status.uptime||'-'"></strong></div>
                  <div class="d-info-item"><div class="lbl">Sistema</div><strong style="font-size:11px" x-text="vm.status.os||'-'"></strong></div>
                  <div class="d-info-item"><div class="lbl">Kernel</div><strong style="font-size:11px" x-text="vm.status.kernel||'-'"></strong></div>
                </div>
                <div class="actions">
                  <button class="btn btn-sm btn-action" @click.stop="confirmAction(vm.id,'chatwoot.target','Reiniciar tudo')"><i data-lucide="refresh-cw" style="width:12px;height:12px"></i>Reiniciar</button>
                  <button class="btn btn-sm btn-action" @click.stop="confirmAction(vm.id,'chatwoot-web.1.service','Reiniciar Web')"><i data-lucide="globe" style="width:12px;height:12px"></i>Web</button>
                  <button class="btn btn-sm btn-action" @click.stop="confirmAction(vm.id,'chatwoot-worker.1.service','Reiniciar Worker')"><i data-lucide="cog" style="width:12px;height:12px"></i>Worker</button>
                  <button class="btn btn-sm btn-ghost" @click.stop="openLogs(vm.id,'chatwoot-web.1.service')"><i data-lucide="file-text" style="width:12px;height:12px"></i>Logs Web</button>
                  <button class="btn btn-sm btn-ghost" @click.stop="openLogs(vm.id,'chatwoot-worker.1.service')"><i data-lucide="file-text" style="width:12px;height:12px"></i>Logs Worker</button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Deploy Bar -->
      <div class="deploy-bar">
        <select x-model="branch"><template x-for="b in branches" :key="b"><option :value="b" x-text="b"></option></template></select>
        <button class="btn btn-cta" @click="openDeployModal()" :disabled="deployingCount>0"><i data-lucide="rocket" style="width:15px;height:15px"></i>Deploy</button>
      </div>

      <!-- Terminal -->
      <template x-if="termShow"><div class="term">
        <div class="term-top"><div class="dots"><span></span><span></span><span></span></div><div class="title"><i data-lucide="terminal" style="width:13px;height:13px"></i><span x-text="termTitle"></span></div><button @click="closeTerm()"><i data-lucide="x" style="width:14px;height:14px"></i></button></div>
        <template x-if="deploySteps.length>0"><div class="term-steps"><template x-for="step in deploySteps" :key="step.id"><div class="term-step">
          <template x-if="step.status==='pending'"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid #525252;display:inline-block;flex-shrink:0"></span></template>
          <template x-if="step.status==='running'"><i data-lucide="loader-2" class="spinner" style="width:14px;height:14px;color:#60a5fa"></i></template>
          <template x-if="step.status==='success'"><i data-lucide="check" style="width:14px;height:14px;color:#4ade80"></i></template>
          <template x-if="step.status==='failed'"><i data-lucide="x" style="width:14px;height:14px;color:#f87171"></i></template>
          <span style="font-size:13px" :style="{color:step.status==='running'?'#93c5fd':step.status==='success'?'#86efac':step.status==='failed'?'#fca5a5':'#525252'}" x-text="step.label"></span>
          <template x-if="step.duration"><span style="font-size:11px;color:#525252;font-family:'JetBrains Mono',monospace;margin-left:auto" x-text="step.duration"></span></template>
        </div></template></div></template>
        <div class="term-body" x-ref="term" @scroll="onTermScroll()" x-html="termContent"></div>
        <template x-if="!termAutoScroll&&termShow"><button class="term-fab" @click="termScrollToBottom()"><i data-lucide="arrow-down" style="width:11px;height:11px"></i>Novas linhas</button></template>
      </div></template>
    </div>
  </div></template>

  <!-- DEPLOY MODAL -->
  <template x-if="showDeploy"><div class="modal-bg" @click.self="showDeploy=false"><div class="modal">
    <h3>Iniciar Deploy</h3>
    <p>Selecione as VMs e a branch para atualizar.</p>
    <div class="modal-warn"><strong>Atencao:</strong> As VMs selecionadas serao atualizadas e reiniciadas. O servico ficara indisponivel por alguns segundos durante o restart.</div>
    <div class="field"><label>Branch</label><select x-model="branch"><template x-for="b in branches" :key="b"><option :value="b" x-text="b"></option></template></select></div>
    <label style="font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:8px">VMs</label>
    <div class="vm-sel"><template x-for="vm in vms" :key="vm.id">
      <div class="vm-sel-item" :class="{'sel':deployVMs.includes(vm.id),'dis':!vm.active}" @click="vm.active&&toggleDep(vm.id)">
        <div class="cb" :class="{'on':deployVMs.includes(vm.id)}"><template x-if="deployVMs.includes(vm.id)"><i data-lucide="check" style="width:11px;height:11px"></i></template></div>
        <span class="dot" :class="{'on':vm.status.online&&vm.active,'off':!vm.status.online&&vm.active,'none':!vm.active}" style="width:7px;height:7px"></span>
        <div style="flex:1"><div style="font-size:13px;font-weight:500" x-text="vm.name"></div><div style="font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace" x-text="vm.ip+' · '+vm.label"></div></div>
      </div>
    </template></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <button class="btn btn-sm btn-ghost" @click="deployVMs=vms.filter(v=>v.active).map(v=>v.id)">Todas</button>
      <button class="btn btn-sm btn-ghost" @click="deployVMs=[]">Nenhuma</button>
      <span style="flex:1"></span><span style="font-size:11px;color:var(--t3)" x-text="deployVMs.length+' selecionada(s)'"></span>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" @click="showDeploy=false">Cancelar</button><button class="btn btn-cta" :disabled="deployVMs.length===0" @click="execDeploy()"><i data-lucide="rocket" style="width:14px;height:14px"></i>Deployar</button></div>
  </div></div></template>

  <!-- CONFIRM MODAL -->
  <template x-if="showConfirm"><div class="modal-bg" @click.self="showConfirm=false"><div class="modal">
    <h3 x-text="confirmTitle"></h3>
    <p x-text="'Tem certeza que deseja '+confirmTitle.toLowerCase()+' na VM '+confirmVmName+'?'"></p>
    <div class="modal-warn">O servico ficara indisponivel por alguns segundos.</div>
    <div class="modal-actions"><button class="btn btn-ghost" @click="showConfirm=false">Cancelar</button><button class="btn btn-sm" style="background:var(--off);color:#fff;border:none" @click="execAction()"><i data-lucide="refresh-cw" style="width:13px;height:13px"></i>Confirmar</button></div>
  </div></div></template>

  <!-- TOAST -->
  <template x-if="toast.show"><div class="toast" :class="toast.type"><i :data-lucide="toast.type==='success'?'check-circle':'alert-circle'" style="width:15px;height:15px"></i><span x-text="toast.msg"></span></div></template>
</div>

<script>
function app(){return{
  auth:false,loginU:'',loginP:'',loginErr:'',loginL:false,
  theme:localStorage.getItem('spx-theme')||'light',
  vms:[],branches:['producao','homologacao','develop'],github:'Dev-Simplex/chatspx',branch:'producao',
  expanded:[],refreshing:false,lastCheck:null,
  showDeploy:false,deployVMs:[],
  termShow:false,termContent:'',termTitle:'Log',termAutoScroll:true,termProgrammaticScroll:false,deploySteps:[],
  showConfirm:false,confirmVmId:'',confirmService:'',confirmTitle:'',confirmVmName:'',
  toast:{show:false,type:'',msg:''},
  socket:null,

  get onlineCount(){return this.vms.filter(v=>v.status?.online&&v.active).length},
  get totalActive(){return this.vms.filter(v=>v.active).length},
  get deployingCount(){return this.vms.filter(v=>v.deploying).length},

  padHB(hb){const p=[];for(let i=0;i<60-hb.length;i++)p.push({online:null,ping:null,time:null,cpu:null,ram:null});return[...p,...hb]},
  fmtMem(mb){return mb>=1024?(mb/1024).toFixed(1)+'G':mb+'M'},

  init(){
    document.documentElement.setAttribute('data-theme',this.theme);
    this.$nextTick(()=>lucide.createIcons());
    fetch('/api/status').then(r=>r.ok?r.json():null).then(d=>{if(!d)return;this.auth=true;this.vms=d.vms;this.branches=d.branches;this.github=d.github;this.updateLastCheck();this.$nextTick(()=>{lucide.createIcons();this.connectSocket()})}).catch(()=>{});
  },

  updateLastCheck(){const now=new Date();this.lastCheck=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},

  async login(){
    this.loginL=true;this.loginErr='';
    try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:this.loginU,pass:this.loginP})});
      if(r.ok){this.auth=true;const d=await(await fetch('/api/status')).json();this.vms=d.vms;this.branches=d.branches;this.github=d.github;this.updateLastCheck();this.$nextTick(()=>{lucide.createIcons();this.connectSocket()})}
      else this.loginErr='Usuario ou senha incorretos'}catch(e){this.loginErr='Erro de conexao'}
    this.loginL=false;this.$nextTick(()=>lucide.createIcons())},

  async logout(){await fetch('/api/logout',{method:'POST'});this.auth=false;this.socket?.disconnect();this.$nextTick(()=>lucide.createIcons())},

  connectSocket(){
    this.socket=io();
    this.socket.on('status:update',d=>{this.vms=d;this.updateLastCheck();this.$nextTick(()=>lucide.createIcons())});
    this.socket.on('deploy:lock',({vmId,locked})=>{const v=this.vms.find(x=>x.id===vmId);if(v)v.deploying=locked;this.$nextTick(()=>lucide.createIcons())});
    this.socket.on('deploy:log',({data})=>{this.appendTerm(data)});
    this.socket.on('deploy:done',({success,vmName})=>{this.showToast(success?'success':'error',success?vmName+' atualizado!':'Falha em '+vmName)});
    this.socket.on('deploy:allDone',()=>{this.showToast('success','Todos os deploys concluidos!')});
    this.socket.on('action:log',({data})=>{this.appendTerm(data)});
    this.socket.on('action:done',({success})=>{this.showToast(success?'success':'error',success?'Reiniciado!':'Falha ao reiniciar')});
    this.socket.on('logs:data',({data})=>{this.appendTerm(data)});
    this.socket.on('logs:done',()=>{this.appendTerm('\n--- Fim dos logs ---\n')});
  },

  appendTerm(data){
    this.termShow=true;
    const lines=data.split('\n');
    for(const line of lines){
      const sm=line.match(/=== ETAPA: (.+) ===/);
      if(sm){const prev=this.deploySteps.find(s=>s.status==='running');if(prev){prev.status='success';prev.duration=prev.st?((Date.now()-prev.st)/1000).toFixed(1)+'s':''}this.deploySteps.push({id:this.deploySteps.length,label:sm[1],status:'running',duration:null,st:Date.now()});this.$nextTick(()=>lucide.createIcons());continue}
      if(line.match(/=== DEPLOY CONCLUIDO ===/)){const prev=this.deploySteps.find(s=>s.status==='running');if(prev){prev.status='success';prev.duration=prev.st?((Date.now()-prev.st)/1000).toFixed(1)+'s':''}}
      if(line.match(/\[ERRO\]/)){const prev=this.deploySteps.find(s=>s.status==='running');if(prev){prev.status='failed';prev.duration=prev.st?((Date.now()-prev.st)/1000).toFixed(1)+'s':''}}
    }
    const e=data.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\[ERRO\]/g,'<span class="err">[ERRO]</span>').replace(/=== ETAPA: .+ ===/g,'').replace(/=== DEPLOY CONCLUIDO ===/g,'<span class="ok">Deploy concluido!</span>').replace(/(sucesso|OK)/gi,'<span class="ok">$1</span>');
    this.termContent+=e;
    if(this.termAutoScroll)this.$nextTick(()=>this.termScrollToBottom());
    this.$nextTick(()=>lucide.createIcons());
  },

  onTermScroll(){if(this.termProgrammaticScroll)return;const el=this.$refs.term;if(!el)return;this.termAutoScroll=(el.scrollHeight-el.scrollTop-el.clientHeight)<50},
  termScrollToBottom(){const el=this.$refs.term;if(!el)return;this.termProgrammaticScroll=true;this.termAutoScroll=true;el.scrollTop=el.scrollHeight;requestAnimationFrame(()=>{this.termProgrammaticScroll=false})},
  closeTerm(){this.termShow=false;this.termContent='';this.deploySteps=[];this.termAutoScroll=true},

  toggleTheme(){this.theme=this.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',this.theme);localStorage.setItem('spx-theme',this.theme);this.$nextTick(()=>lucide.createIcons())},
  toggle(id){const i=this.expanded.indexOf(id);if(i===-1)this.expanded.push(id);else this.expanded.splice(i,1);this.$nextTick(()=>lucide.createIcons())},
  doRefresh(){this.refreshing=true;this.socket?.emit('refresh');setTimeout(()=>{this.refreshing=false},2000)},

  openDeployModal(){this.deployVMs=[];this.showDeploy=true;this.$nextTick(()=>lucide.createIcons())},
  toggleDep(id){const i=this.deployVMs.indexOf(id);if(i===-1)this.deployVMs.push(id);else this.deployVMs.splice(i,1)},
  execDeploy(){this.showDeploy=false;this.termContent='';this.deploySteps=[];this.termAutoScroll=true;this.termTitle='Deploy - '+this.branch;this.termShow=true;this.socket.emit('deploy',{vmIds:[...this.deployVMs],branch:this.branch});this.$nextTick(()=>lucide.createIcons())},

  confirmAction(vmId,service,title){this.confirmVmId=vmId;this.confirmService=service;this.confirmTitle=title;this.confirmVmName=this.vms.find(v=>v.id===vmId)?.name||vmId;this.showConfirm=true;this.$nextTick(()=>lucide.createIcons())},
  execAction(){this.showConfirm=false;this.termContent='';this.deploySteps=[];this.termAutoScroll=true;this.termTitle=this.confirmTitle+' - '+this.confirmVmName;this.termShow=true;this.socket.emit('restart',{vmId:this.confirmVmId,service:this.confirmService});this.$nextTick(()=>lucide.createIcons())},
  openLogs(vmId,service){this.termContent='';this.deploySteps=[];this.termAutoScroll=true;this.termTitle='Logs '+(this.vms.find(v=>v.id===vmId)?.name||vmId);this.termShow=true;this.socket.emit('viewLogs',{vmId,service});this.$nextTick(()=>lucide.createIcons())},

  showToast(type,msg){this.toast={show:true,type,msg};this.$nextTick(()=>lucide.createIcons());setTimeout(()=>{this.toast.show=false},4000)},
}}
</script>
</body>
</html>
