upstream backend {
  zone upstreams 64K;
  server 127.0.0.1:3000;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name chatwoot.domain.com www.chatwoot.domain.com;

  access_log /var/log/nginx/chatwoot_access_80.log;
  error_log /var/log/nginx/chatwoot_error_80.log;

  return 301 https://chatwoot.domain.com$request_uri;
}

server {
  listen 443 ssl http2 reuseport;
  listen [::]:443 ssl http2 reuseport;
  server_name chatwoot.domain.com www.chatwoot.domain.com;

  underscores_in_headers on;

  access_log /var/log/nginx/chatwoot_access_443.log;
  error_log /var/log/nginx/chatwoot_error_443.log;

  # Pagina customizada de manutencao
  error_page 502 503 504 /manutencao.html;
  location = /manutencao.html {
    root /var/www/custom_errors;
  }

  # ---- limites e timeouts ----
  client_max_body_size      256M;
  proxy_read_timeout        900s;
  proxy_send_timeout        900s;
  send_timeout              900s;
  proxy_connect_timeout     60s;

  proxy_request_buffering   off;
  proxy_buffering           off;

  # ---------- headers padrao ----------
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port  $server_port;

  # ---------- Assets estaticos — servidos direto do disco ----------
  location /vite/ {
    root /home/chatwoot/chatwoot/public;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    gzip_static on;
  }

  location /packs/ {
    root /home/chatwoot/chatwoot/public;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    gzip_static on;
  }

  location /assets/ {
    root /home/chatwoot/chatwoot/public;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    gzip_static on;
  }

  location = /version.json {
    root /home/chatwoot/chatwoot/public;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
  }

  # ---------- X-Accel-Redirect: Nginx serve arquivos direto do disco ----------
  # Rails envia header X-Accel-Redirect, Nginx intercepta e serve sem ocupar Puma
  # Suporta Range requests automaticamente (streaming progressivo de audio/video)
  location /send_file_accel/ {
    internal;
    alias /home/chatwoot/chatwoot/storage/;
    add_header Cache-Control "private, max-age=86400, immutable";
    add_header Accept-Ranges bytes;
    access_log off;
  }

  # ---------- WebSocket (ActionCable) ----------
  location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_pass http://backend;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---------- API ----------
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_pass http://backend;
    proxy_redirect off;
  }

  # ---------- UI, inbox publica, uploads ----------
  location / {
    proxy_http_version 1.1;
    proxy_pass http://backend;
    proxy_redirect off;
  }

  # ---- TLS ----
  ssl_certificate /etc/letsencrypt/live/chatwoot.domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chatwoot.domain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_dhparam /etc/ssl/dhparam;
  ssl_early_data on;
  ssl_buffer_size 4k;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
