  <div id="app" v-cloak></div>

  <script>
    const { createApp, ref, reactive, onMounted, computed } = Vue;
    const Icon = { props: { n: String, cls: { type: String, default: 'w-5 h-5' } },
      template: '<svg :class="cls" fill="currentColor" aria-hidden="true"><use :href="\'#i-\'+n"></use></svg>' };

    createApp({
      setup() {
        const token = ref(localStorage.getItem('alm_token') || 'dev-demo-token');
        const view = ref('frota');
        const fleet = ref([]); const health = reactive({}); const deploys = ref([]); const tokens = ref([]); const msg = ref('');

        const api = async (path, opts = {}) => {
          const r = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token.value } });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('HTTP ' + r.status));
          return r.json();
        };
        const saveToken = () => { localStorage.setItem('alm_token', token.value); refresh(); };
        const refresh = async () => {
          msg.value = '';
          try {
            const f = await api('/fleet'); fleet.value = f.vms || [];
            deploys.value = await api('/deploys');
            for (const vm of fleet.value) api('/vms/' + vm.id + '/health').then(h => { health[vm.id] = h; }).catch(() => { health[vm.id] = { healthy:false, online:false }; });
          } catch (e) { msg.value = e.message; }
        };
        const pending = computed(() => deploys.value.filter(d => d.status === 'pending'));
        const recent = computed(() => deploys.value.filter(d => d.status !== 'pending').slice(0, 12));
        const byEnv = computed(() => { const g = {}; for (const v of fleet.value) (g[v.env] = g[v.env] || []).push(v); return g; });
        const healthyCount = computed(() => fleet.value.filter(v => health[v.id] && health[v.id].healthy).length);
        const viewIcon = computed(() => ({ frota:'anchor-d', aprovacoes:'seal-check-d', historico:'clock-counter-clockwise-d', tokens:'key-d', conectar:'plugs-connected-d' }[view.value] || 'anchor-d'));

        const act = async (id, action) => { try { await api('/deploys/' + id + '/' + action, { method:'POST' }); await refresh(); } catch (e) { msg.value = e.message; } };
        const loadTokens = async () => { try { tokens.value = await api('/tokens'); } catch (e) { msg.value = e.message; } };
        const newToken = async () => {
          const name = prompt('Nome do dev:'); if (!name) return;
          const role = prompt('Papel (viewer / operator / admin):', 'operator') || 'operator';
          try { const t = await api('/tokens', { method:'POST', body: JSON.stringify({ name, role }) }); window.prompt('Token de ' + name + ' — copie AGORA (não será mostrado de novo):', t.token); loadTokens(); }
          catch (e) { msg.value = e.message; }
        };
        const revokeToken = async (id) => { if (!confirm('Revogar o token ' + id + '?')) return; try { await api('/tokens/' + id, { method:'DELETE' }); loadTokens(); } catch (e) { msg.value = e.message; } };
        const go = (v) => { view.value = v; if (v === 'tokens') loadTokens(); };
        const dotClass = (h) => (h && h.healthy) ? 'bg-ok pulse-ok' : (h && h.online ? 'bg-warn' : 'bg-bad');
        const relTime = (s) => s ? s.slice(0,16).replace('T',' ') : '—';

        onMounted(refresh);
        return { token, saveToken, view, go, fleet, health, deploys, tokens, msg, refresh, pending, recent, byEnv, healthyCount, viewIcon, act, loadTokens, newToken, revokeToken, dotClass, relTime };
      },
      template: `
      <div class="flex min-h-screen">
        <aside class="w-60 shrink-0 border-r border-hair/70 flex flex-col fixed h-screen bg-abyss/40 backdrop-blur">
          <div class="px-5 py-5 flex items-center gap-2.5">
            <ic n="anchor" cls="w-8 h-8 text-brass" />
            <div><div class="font-display font-extrabold text-[19px] leading-none text-slate-100 tracking-tight">Almirante</div><div class="text-[10px] uppercase tracking-[.2em] text-mute mt-1">Comando da Frota</div></div>
          </div>
          <nav class="px-3 mt-2 space-y-0.5 text-sm">
            <button @click="go('frota')" :class="['navitem w-full text-left rounded-md px-3 py-2 flex items-center gap-2.5 transition', view==='frota'?'active':'text-slate-400 hover:text-slate-200']"><ic n="anchor" cls="w-4 h-4"/><span class="flex-1">Frota</span><span class="font-mono text-xs text-mute">{{ healthyCount }}/{{ fleet.length }}</span></button>
            <button @click="go('aprovacoes')" :class="['navitem w-full text-left rounded-md px-3 py-2 flex items-center gap-2.5 transition', view==='aprovacoes'?'active':'text-slate-400 hover:text-slate-200']"><ic n="bell" cls="w-4 h-4"/><span class="flex-1">Aprovações</span><span v-if="pending.length" class="text-[11px] font-bold bg-brass text-ink rounded-full px-1.5">{{ pending.length }}</span></button>
            <button @click="go('historico')" :class="['navitem w-full text-left rounded-md px-3 py-2 flex items-center gap-2.5 transition', view==='historico'?'active':'text-slate-400 hover:text-slate-200']"><ic n="clock-counter-clockwise" cls="w-4 h-4"/><span>Histórico</span></button>
            <button @click="go('tokens')" :class="['navitem w-full text-left rounded-md px-3 py-2 flex items-center gap-2.5 transition', view==='tokens'?'active':'text-slate-400 hover:text-slate-200']"><ic n="key" cls="w-4 h-4"/><span>Tokens</span></button>
            <button @click="go('conectar')" :class="['navitem w-full text-left rounded-md px-3 py-2 flex items-center gap-2.5 transition', view==='conectar'?'active':'text-slate-400 hover:text-slate-200']"><ic n="plugs-connected" cls="w-4 h-4"/><span>Como conectar</span></button>
          </nav>
          <div class="mt-auto p-3 hairtop">
            <label class="text-[10px] uppercase tracking-wider text-mute px-1">Seu token</label>
            <div class="flex gap-1.5 mt-1">
              <input v-model="token" @keyup.enter="saveToken" class="flex-1 bg-ink/70 border border-hair rounded px-2 py-1.5 text-xs font-mono w-0 focus:border-brass outline-none" />
              <button @click="saveToken" class="text-xs bg-brass/90 hover:bg-brass text-ink font-semibold rounded px-2">ok</button>
            </div>
            <button @click="refresh" class="mt-2 w-full flex items-center justify-center gap-1.5 text-xs text-mute hover:text-sonar transition"><ic n="arrows-clockwise" cls="w-3.5 h-3.5"/> atualizar frota</button>
          </div>
        </aside>

        <main class="flex-1 ml-60 px-8 py-7 max-w-[1400px] relative">
          <ic :n="viewIcon" cls="absolute right-2 top-0 w-44 h-44 text-brass opacity-[.06] pointer-events-none select-none" />
          <div class="flex items-center justify-between mb-7 relative">
            <div>
              <h1 class="font-display font-extrabold text-3xl text-slate-100 tracking-tight">{{ view==='conectar'?'Como conectar':view==='aprovacoes'?'Fila de aprovação':view==='historico'?'Histórico':view==='tokens'?'Tokens & Dispositivos':'Frota' }}</h1>
              <p class="text-mute text-xs mt-1 tracking-wide">A IA propõe · o humano autoriza · o sistema registra</p>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono text-mute"><ic n="pulse" cls="w-4 h-4 text-ok"/> {{ healthyCount }}/{{ fleet.length }} saudáveis</div>
          </div>
          <p v-if="msg" class="mb-5 text-warn text-sm bg-warn/10 border border-warn/30 rounded-lg px-3 py-2 flex items-center gap-2"><ic n="warning-octagon" cls="w-4 h-4"/>{{ msg }}</p>

          <!-- FROTA -->
          <div v-if="view==='frota'">
            <div class="hero relative overflow-hidden rounded-2xl card mb-8 rise">
              <div class="hero-grid absolute inset-0"></div>
              <div class="radar absolute -right-8 -top-8 opacity-70 hidden md:block"><div class="radar__cross absolute inset-0"></div><div class="radar__sweep"></div><span class="blip" style="left:58%;top:40%"></span><span class="blip" style="left:70%;top:62%;animation-delay:1s"></span><span class="blip" style="left:46%;top:66%;animation-delay:2s"></span></div>
              <div class="relative p-7">
                <div class="text-[11px] tracking-[.25em] uppercase text-brass/80 flex items-center gap-2"><ic n="gauge" cls="w-4 h-4"/> Mission Control · ChatSPX</div>
                <h2 class="font-display font-extrabold text-4xl text-slate-100 mt-3">Comando da Frota</h2>
                <p class="text-mute mt-2 max-w-md text-sm">{{ healthyCount }} de {{ fleet.length }} embarcações saudáveis. Atualize, inspecione e autorize operações — tudo sob o gate humano.</p>
                <div class="flex gap-6 mt-5 font-mono text-xs">
                  <div><div class="text-2xl font-bold text-ok font-display">{{ healthyCount }}</div><div class="text-mute uppercase tracking-wider text-[10px]">saudáveis</div></div>
                  <div><div class="text-2xl font-bold text-brass font-display">{{ pending.length }}</div><div class="text-mute uppercase tracking-wider text-[10px]">aguardando</div></div>
                  <div><div class="text-2xl font-bold text-slate-200 font-display">{{ fleet.length }}</div><div class="text-mute uppercase tracking-wider text-[10px]">VMs</div></div>
                </div>
              </div>
            </div>
            <div v-for="(vms, env, gi) in byEnv" :key="env" class="mb-7 rise" :style="{ animationDelay:(gi*60)+'ms' }">
              <div class="flex items-center gap-3 mb-3"><ic n="hard-drives" cls="w-4 h-4 text-brass/70"/><h2 class="text-[11px] uppercase tracking-[.22em] text-brass/80 font-semibold">{{ env }}</h2><div class="flex-1 h-px bg-hair/60"></div></div>
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5">
                <div v-for="(vm,i) in vms" :key="vm.id" class="card rounded-xl p-4 rise transition" :style="{ animationDelay:(gi*60+i*40)+'ms' }">
                  <div class="flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded-full" :class="dotClass(health[vm.id])"></span><span class="font-semibold text-slate-100">{{ vm.name }}</span><span v-if="vm.critical" class="ml-auto text-[9px] tracking-wider text-bad/90 border border-bad/40 rounded px-1.5 py-0.5 uppercase">crítica</span></div>
                  <div class="mt-3 font-mono text-xs text-mute"><span class="text-sonar">{{ (health[vm.id]&&health[vm.id].commit)||'·······' }}</span> · {{ vm.branch }}</div>
                  <div class="mt-2 text-[11px] text-mute">{{ vm.env }} · {{ vm.auto_approve?'auto-deploy':'gate manual' }}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- APROVAÇÕES -->
          <div v-else-if="view==='aprovacoes'">
            <div v-if="!pending.length" class="card rounded-xl p-12 text-center text-mute"><ic n="seal-check-d" cls="w-16 h-16 mx-auto text-ok/70 mb-3"/>Nenhuma operação aguardando autorização.</div>
            <div v-for="(d,i) in pending" :key="d.id" class="card rounded-xl p-5 mb-3 rise flex items-center justify-between" :style="{ animationDelay:(i*50)+'ms', borderColor:'#3A2E14' }">
              <div>
                <div class="font-semibold text-slate-100 text-lg flex items-center gap-2">{{ d.vm }} <span class="font-mono text-xs text-mute">{{ d.current_sha }} → <span class="text-sonar">{{ d.target_sha }}</span></span></div>
                <div class="text-xs text-mute mt-1 flex items-center gap-1.5">pedido por <span class="text-slate-300">{{ d.requested_by }}</span> · {{ (d.migrations||[]).length }} migration(s)<span v-if="d.has_destructive" class="text-bad font-semibold flex items-center gap-1 ml-1"><ic n="warning-octagon" cls="w-3.5 h-3.5"/>DESTRUTIVA</span></div>
              </div>
              <div class="flex gap-2">
                <button @click="act(d.id,'approve')" class="bg-ok/90 hover:bg-ok text-ink font-bold rounded-lg px-5 py-2.5 text-sm transition flex items-center gap-1.5"><ic n="check-circle" cls="w-4 h-4"/>Aprovar</button>
                <button @click="act(d.id,'reject')" class="border border-hair hover:border-bad/50 hover:text-bad text-mute rounded-lg px-4 py-2.5 text-sm transition flex items-center gap-1.5"><ic n="x-circle" cls="w-4 h-4"/>Rejeitar</button>
              </div>
            </div>
          </div>

          <!-- HISTÓRICO -->
          <div v-else-if="view==='historico'" class="card rounded-xl overflow-hidden rise">
            <table class="w-full text-sm">
              <thead class="text-mute text-[11px] uppercase tracking-wider"><tr class="text-left"><th class="px-4 py-3 font-medium">VM</th><th class="font-medium">Mudança</th><th class="font-medium">Autor / Aprovou</th><th class="font-medium">Status</th></tr></thead>
              <tbody>
                <tr v-for="d in recent" :key="d.id" class="border-t border-hair/50 hover:bg-surface/40"><td class="px-4 py-2.5 font-mono text-xs text-slate-300">{{ d.vm }}</td><td class="font-mono text-xs">{{ d.current_sha }}→<span class="text-sonar">{{ d.target_sha }}</span></td><td class="text-xs text-mute">{{ d.requested_by }} / {{ d.approved_by||'—' }}</td><td><span class="text-[11px] px-2 py-0.5 rounded-full" :class="d.status==='success'?'bg-ok/15 text-ok':'bg-hair/60 text-mute'">{{ d.status }}</span></td></tr>
                <tr v-if="!recent.length"><td colspan="4" class="px-4 py-6 text-mute text-sm">Sem histórico ainda.</td></tr>
              </tbody>
            </table>
          </div>

          <!-- TOKENS -->
          <div v-else-if="view==='tokens'">
            <div class="flex justify-end mb-3"><button @click="newToken" class="bg-brass/90 hover:bg-brass text-ink font-semibold rounded-lg px-4 py-2 text-sm transition flex items-center gap-1.5"><ic n="key" cls="w-4 h-4"/>Novo token</button></div>
            <div class="card rounded-xl overflow-hidden rise">
              <table class="w-full text-sm">
                <thead class="text-mute text-[11px] uppercase tracking-wider"><tr class="text-left"><th class="px-4 py-3 font-medium">Dev</th><th class="font-medium">Papel</th><th class="font-medium">Dispositivo (PC)</th><th class="font-medium">Último acesso</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="t in tokens" :key="t.id" class="border-t border-hair/50" :class="{ 'opacity-40': t.revoked }"><td class="px-4 py-2.5">{{ t.name }} <span class="text-slate-600 font-mono text-xs">{{ t.secret }}</span></td><td><span class="text-[11px] px-2 py-0.5 rounded bg-hair/60 uppercase tracking-wide">{{ t.role }}</span></td><td class="font-mono text-xs text-slate-300 flex items-center gap-1.5 py-2.5"><ic n="hard-drives" cls="w-3.5 h-3.5 text-mute"/>{{ t.last_host||'—' }} <span class="text-mute">{{ t.last_ip }}</span></td><td class="text-xs text-mute">{{ t.last_seen?relTime(t.last_seen):'nunca usou' }}</td><td class="text-right pr-4"><button v-if="!t.revoked" @click="revokeToken(t.id)" class="text-bad/80 hover:text-bad text-xs flex items-center gap-1 ml-auto"><ic n="prohibit" cls="w-3.5 h-3.5"/>Revogar</button><span v-else class="text-mute text-xs">revogado</span></td></tr>
                  <tr v-if="!tokens.length"><td colspan="5" class="px-4 py-6 text-mute text-sm">Nenhum token emitido. Clique "Novo token".</td></tr>
                </tbody>
              </table>
            </div>
            <p class="text-mute text-xs mt-3">O dev cola o token no <code class="text-sonar">.mcp.json</code>; na 1ª chamada o painel registra o <b class="text-slate-300">PC</b> (hostname/IP). Revogar corta o acesso na hora.</p>
          </div>

          <!-- CONECTAR -->
          <div v-else-if="view==='conectar'" class="rise max-w-3xl">
            <div class="card rounded-xl p-6">
              <h2 class="font-display font-bold text-xl text-slate-100 mb-1 flex items-center gap-2"><ic n="plugs-connected" cls="w-5 h-5 text-sonar"/>Plugar no Claude Code</h2>
              <p class="text-mute text-sm mb-3">Cole no <code class="text-sonar">.mcp.json</code> do projeto e troque o token pelo seu:</p>
              <pre class="bg-ink/80 border border-hair rounded-lg p-4 text-xs text-slate-300 overflow-x-auto">{
  "mcpServers": {
    "almirante": {
      "command": "/usr/local/bin/almirante-mcp",
      "env": {
        "ALMIRANTE_MOCK": "0",
        "ALMIRANTE_CONTROL_URL": "http://192.168.8.229:4100",
        "ALMIRANTE_DEV_TOKEN": "SEU_TOKEN_AQUI"
      }
    }
  }
}</pre>
              <p class="text-mute text-sm mt-4 mb-1">Depois é só <b class="text-slate-300">falar natural</b>:</p>
              <ul class="text-sonar/90 text-sm space-y-1"><li>› "qual o status da tozi?" · "quem precisa de deploy?"</li><li>› "atualiza a homologação" · "reinicia a fábrica"</li><li>› "promove a homologação pra produção" · "rollback da tozi"</li></ul>
            </div>
            <div class="card rounded-xl p-6 mt-4">
              <h3 class="font-display font-bold text-lg text-slate-100 mb-3 flex items-center gap-2"><ic n="terminal-window" cls="w-5 h-5 text-brass"/>Tools</h3>
              <div class="grid md:grid-cols-2 gap-4 text-xs text-mute">
                <div><b class="text-slate-200">Observabilidade</b><br/>fleet_status · vm_status · vm_health · migration_status · git_diff · deploy_history · version_matrix · drift_check · sidekiq_status · disk_usage · service_status · list_pending · whoami</div>
                <div><b class="text-slate-200">Deploy &amp; Merge</b><br/>propose_deploy_vm · propose_deploy_all · propose_deploy_group · dry_run · <b class="text-brass">propose_merge</b></div>
                <div><b class="text-slate-200">Ciclo-de-vida</b><br/>propose_restart_vm · propose_restart_service · propose_migrate · propose_precompile · propose_rollback</div>
                <div><b class="text-slate-200">Manutenção</b><br/>freeze_deploys · unfreeze_deploys · freeze_status · cancel_request · deploy_logs · service_logs</div>
              </div>
              <p class="text-mute text-xs mt-4 hairtop pt-3">A IA <b class="text-slate-300">propõe</b>; nenhuma tool executa ou aprova sozinha — quem autoriza é um humano (gate fora do LLM).</p>
            </div>
          </div>
        </main>
      </div>
      `
    }).component('ic', Icon).mount('#app');
  </script>
</body>
</html>
