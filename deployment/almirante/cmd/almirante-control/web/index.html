  <style>
    /* ── tokens (iOS/glass, light + dark) ── */
    :root{
      --bg:#F4F5FA; --bg2:#ECEEF6;
      --surface:255 255 255; --hair:15 23 42; --hairA:.08;
      --tx1:17 24 39; --tx2:71 85 105; --tx3:148 163 184;
      --brand:99 102 241; --shadow:2 6 23;
    }
    .dark{
      --bg:#08090E; --bg2:#0C0E15;
      --surface:22 24 33; --hair:255 255 255; --hairA:.09;
      --tx1:237 240 246; --tx2:160 170 190; --tx3:110 120 140;
      --brand:129 140 248; --shadow:0 0 0;
    }
    body{ background:var(--bg); color:rgb(var(--tx1)); }
    /* ── aurora (blobs desfocados; pai já é fixed/isolate) ── */
    .aurora{ position:fixed; inset:0; z-index:-10; overflow:hidden; pointer-events:none; }
    .aurora i{ position:absolute; border-radius:9999px; filter:blur(90px); opacity:.5; }
    .b1{ width:38rem;height:38rem; left:-10rem;top:-12rem; background:radial-gradient(circle,#6366F1,transparent 70%); animation:float 30s ease-in-out infinite; }
    .b2{ width:32rem;height:32rem; right:-9rem;top:8%; background:radial-gradient(circle,#8B5CF6,transparent 70%); animation:float 38s ease-in-out infinite reverse; }
    .b3{ width:30rem;height:30rem; left:28%;bottom:-12rem; background:radial-gradient(circle,#0EA5E9,transparent 70%); animation:float 34s ease-in-out infinite; }
    .dark .aurora i{ opacity:.32; }
    @keyframes float{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
    /* ── superfícies / vidro ── */
    .glass{ background:rgb(var(--surface)/.72); backdrop-filter:blur(20px) saturate(1.5); -webkit-backdrop-filter:blur(20px) saturate(1.5); border:1px solid rgb(var(--hair)/var(--hairA)); }
    .soft{ background:rgb(var(--surface)/.5); border:1px solid rgb(var(--hair)/var(--hairA)); }
    .tx1{color:rgb(var(--tx1))} .tx2{color:rgb(var(--tx2))} .tx3{color:rgb(var(--tx3))}
    .bg1{background:var(--bg)} .hair{border-color:rgb(var(--hair)/var(--hairA))}
    .field{ background:rgb(var(--surface)/.6); border:1px solid rgb(var(--hair)/.12); color:rgb(var(--tx1)); border-radius:.7rem; }
    .field:focus{ outline:none; border-color:rgb(var(--brand)/.7); box-shadow:0 0 0 3px rgb(var(--brand)/.14); }
    .navp{ transition:.15s; color:rgb(var(--tx2)); }
    .navp:hover{ color:rgb(var(--tx1)); background:rgb(var(--hair)/.05); }
    .navp.on{ background:rgb(var(--brand)/.12); color:rgb(var(--brand)); font-weight:700; }
    .btn-brand{ background:linear-gradient(180deg,#6366F1,#4F46E5); color:#fff; box-shadow:0 6px 16px rgb(79 70 229/.3); }
    .btn-ghost{ background:rgb(var(--surface)/.6); border:1px solid rgb(var(--hair)/.12); color:rgb(var(--tx1)); }
    .card{ transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s, border-color .2s; }
    .card:hover{ transform:translateY(-3px); box-shadow:0 16px 40px rgb(var(--shadow)/.12); border-color:rgb(var(--brand)/.3); }
    .expand{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.2,.8,.2,1), opacity .4s, margin-top .35s; }
    .card:hover .expand{ max-height:380px; opacity:1; margin-top:14px; }
    .mbar{ height:6px; border-radius:9999px; background:rgb(var(--hair)/.1); overflow:hidden; }
    .mbar>span{ display:block; height:100%; border-radius:9999px; background:linear-gradient(90deg,#6366F1,#8B5CF6); transition:width .6s cubic-bezier(.2,.8,.2,1); }
    @keyframes shimmer{ 0%,100%{opacity:.4} 50%{opacity:.75} }
    .skel{ background:rgb(var(--hair)/.08); border-radius:8px; animation:shimmer 1.4s ease-in-out infinite; }
    .press:active{ transform:scale(.96); }
    .chip{ font-size:12px; font-weight:600; padding:5px 10px; border-radius:8px; background:rgb(var(--brand)/.09); color:rgb(var(--tx2)); border:1px solid rgb(var(--brand)/.16); }
    @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgb(16 185 129/.5)} 70%{box-shadow:0 0 0 6px rgb(16 185 129/0)} 100%{box-shadow:0 0 0 0 rgb(16 185 129/0)} }
    .live{ animation:pulse 2.6s ease-out infinite; }
    @keyframes rise{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    .rise{ animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
    .gtext{ background:linear-gradient(120deg,rgb(var(--tx1)),#6366F1 55%,#8B5CF6); -webkit-background-clip:text; background-clip:text; color:transparent; }
    ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:rgb(var(--hair)/.18);border-radius:6px;border:3px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-track{background:transparent}
    pre{font-family:'JetBrains Mono',monospace}
    [v-cloak]{display:none}
    @media (prefers-reduced-motion: reduce){ .aurora i,.live,.rise,.card{ animation:none!important; transition:none!important } }
  </style>

  </svg>
  <div id="app" v-cloak></div>

  <script>
    const { createApp, ref, reactive, onMounted, computed } = Vue;
    const Icon = { props:{ n:String, cls:{type:String, default:'w-5 h-5'} },
      template:'<svg :class="cls" fill="currentColor" aria-hidden="true"><use :href="\'#i-\'+n"></use></svg>' };

    createApp({
      setup() {
        const token = ref(localStorage.getItem('alm_token') || '');
        const me = ref(null);
        const setpwToken = ref(new URLSearchParams(location.search).get('setpw') || '');
        const li = reactive({ email:'', pass:'', err:'', busy:false });
        const sp = reactive({ pass:'', pass2:'', err:'', busy:false });
        const usersList = ref([]);
        const view = ref('frota');
        const fleet = ref([]); const status = reactive({}); const metrics = reactive({}); const deploys = ref([]); const tokens = ref([]); const msg = ref('');

        // ── tema (iOS light/dark) ──
        const theme = ref(localStorage.getItem('alm_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        const applyTheme = () => { document.documentElement.classList.toggle('dark', theme.value !== 'light'); };
        const toggleTheme = () => { theme.value = theme.value === 'light' ? 'dark' : 'light'; localStorage.setItem('alm_theme', theme.value); applyTheme(); };
        applyTheme();

        const api = async (path, opts={}) => {
          const r = await fetch('/api'+path, { ...opts, headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token.value } });
          if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ('HTTP '+r.status));
          return r.json();
        };
        const saveToken = () => { localStorage.setItem('alm_token', token.value); refresh(); };
        const refresh = async () => {
          msg.value='';
          try {
            fleet.value = ((await api('/fleet')).vms) || [];
            deploys.value = (await api('/deploys')) || [];
            for (const vm of fleet.value)
              api('/vms/'+vm.id+'/status').then(s=>{ status[vm.id]=s; }).catch(()=>{ status[vm.id]={online:false}; });
          } catch(e){ msg.value=e.message; }
        };
        const pending = computed(()=> (deploys.value||[]).filter(d=>d.status==='pending'));
        const recent = computed(()=> (deploys.value||[]).filter(d=>d.status!=='pending').slice(0,12));
        const byEnv = computed(()=>{ const g={}; for (const v of fleet.value) (g[v.env]=g[v.env]||[]).push(v); return g; });
        const onlineCount = computed(()=> fleet.value.filter(v=> status[v.id] && status[v.id].online).length);

        const act = async (id, action) => { try{ await api('/deploys/'+id+'/'+action,{method:'POST'}); await refresh(); }catch(e){ msg.value=e.message; } };
        const loadTokens = async () => { try{ tokens.value = (await api('/tokens')) || []; }catch(e){ msg.value=e.message; } };
        const newToken = async () => {
          const name=prompt('Nome do dev:'); if(!name) return;
          const role=prompt('Papel (viewer / operator / admin):','operator')||'operator';
          try{ const t=await api('/tokens',{method:'POST',body:JSON.stringify({name,role})}); window.prompt('Token de '+name+' — copie AGORA (não será mostrado de novo):',t.token); loadTokens(); }
          catch(e){ msg.value=e.message; }
        };
        const revokeToken = async (id) => { if(!confirm('Revogar o token '+id+'?')) return; try{ await api('/tokens/'+id,{method:'DELETE'}); loadTokens(); }catch(e){ msg.value=e.message; } };
        const go = (v)=>{ view.value=v; if(v==='tokens') loadTokens(); if(v==='usuarios') loadUsers(); if(v==='ia') aiLoadVms(); if(v==='github') ghLoad(); };
        // ---- auth de humano ----
        const checkMe = async () => { try{ me.value = await api('/me'); refresh(); }catch(e){ me.value=null; } };
        const doLogin = async () => { li.err=''; li.busy=true; try{ me.value = await api('/login',{method:'POST',body:JSON.stringify({email:li.email,password:li.pass})}); li.pass=''; refresh(); }catch(e){ li.err='Email ou senha inválidos'; } li.busy=false; };
        const doSetPw = async () => { sp.err=''; if(sp.pass.length<8){sp.err='Mínimo 8 caracteres';return;} if(sp.pass!==sp.pass2){sp.err='As senhas não conferem';return;} sp.busy=true; try{ me.value = await api('/set-password',{method:'POST',body:JSON.stringify({token:setpwToken.value,password:sp.pass})}); setpwToken.value=''; history.replaceState({},'',location.pathname); refresh(); }catch(e){ sp.err=e.message; } sp.busy=false; };
        const logout = async () => { try{ await api('/logout',{method:'POST'}); }catch(e){} me.value=null; token.value=''; localStorage.removeItem('alm_token'); };
        const tokenLogin = () => { const t=prompt('Cole seu token (MCP / emergência):'); if(!t) return; token.value=t.trim(); localStorage.setItem('alm_token',token.value); checkMe(); };
        const loadUsers = async () => { try{ usersList.value = (await api('/users'))||[]; }catch(e){ msg.value=e.message; } };
        const addUser = async () => { const email=prompt('Email do novo usuário:'); if(!email) return; const name=prompt('Nome:')||''; const role=prompt('Papel (viewer / operator / admin):','operator')||'operator'; try{ const r=await api('/users',{method:'POST',body:JSON.stringify({email,name,role})}); if(r.email_error){ window.prompt('Usuário criado, mas o email falhou. Envie este link manualmente:', r.link); } else { msg.value='✓ Convite enviado para '+email; } loadUsers(); }catch(e){ msg.value='⚠️ '+e.message; } };
        const delUser = async (id) => { if(!confirm('Remover usuário '+id+'?')) return; try{ await api('/users/'+id,{method:'DELETE'}); loadUsers(); }catch(e){ msg.value=e.message; } };
        // lazy-fetch das métricas ao passar o mouse (card expande estilo Apple)
        const mstate = reactive({});
        const loadMetrics = async (id) => {
          if(mstate[id]) return;
          mstate[id]='loading';
          const t=setTimeout(()=>{ if(mstate[id]==='loading') mstate[id]='error'; }, 10000);
          try{
            const m=await api('/vms/'+id+'/metrics'); clearTimeout(t);
            if(m && m.online && m.uptime){ metrics[id]=m; mstate[id]='ok'; }
            else { metrics[id]=m||{}; mstate[id]='unavail'; }
          }catch(e){ clearTimeout(t); mstate[id]='error'; }
        };
        const retryMetrics = (id) => { delete mstate[id]; delete metrics[id]; loadMetrics(id); };
        const restartVM = async (id, unit, label) => {
          if(!confirm('Reiniciar '+label+'?\\n\\n(reinício direto, será registrado no histórico)')) return;
          msg.value='';
          try{ await api('/vms/'+id+'/restart',{method:'POST',body:JSON.stringify({unit})}); msg.value='✓ Reiniciado: '+label; delete metrics[id]; }
          catch(e){ msg.value='⚠️ '+e.message; }
        };

        const envStyle = (env)=>{
          if(/AWS/i.test(env)) return { icon:'cloud', text:'text-info', chip:'bg-info/10 text-info' };
          if(/Dev/i.test(env)) return { icon:'cpu', text:'text-violet', chip:'bg-violet/10 text-violet' };
          return { icon:'hard-drives', text:'text-brand', chip:'bg-brand/10 text-brand' };
        };
        const relTime = (s)=> s ? s.slice(0,16).replace('T',' ') : '—';
        const titleOf = { frota:'Frota', ia:'IA · Agentes', github:'GitHub', release:'Release', aprovacoes:'Aprovações', historico:'Histórico', tokens:'Tokens & Dispositivos', usuarios:'Usuários', conectar:'Como conectar' };

        // ---- Release ----
        const rel = reactive({ sel:{}, dry:[], running:null, busy:false, err:'' });
        const relSelected = ()=> fleet.value.filter(v=>rel.sel[v.id]).map(v=>v.id);
        const relToggle = (id)=>{ rel.sel[id] = !rel.sel[id]; };
        const relGroup = (env)=>{ for(const v of fleet.value){ if(env==='all'||v.env===env) rel.sel[v.id]=true; } };
        const relClear = ()=>{ rel.sel={}; rel.dry=[]; rel.running=null; };
        const relDry = async ()=>{ const vms=relSelected(); if(!vms.length){ rel.err='selecione ao menos 1 máquina'; return; } rel.err=''; rel.busy=true; try{ rel.dry = (await api('/release/dryrun',{method:'POST',body:JSON.stringify({vms})}))||[]; }catch(e){ rel.err=e.message; } rel.busy=false; };
        const relPoll = async (id)=>{ try{ const r=await api('/release/'+id); rel.running=r; if(r.status==='running') setTimeout(()=>relPoll(id),4000); }catch(e){} };
        const relGo = async ()=>{ const vms=relSelected(); if(!vms.length){ rel.err='selecione ao menos 1 máquina'; return; } if(!confirm('Release SEQUENCIAL em '+vms.length+' máquina(s):\n'+vms.join(', ')+'\n\nDeploya uma de cada vez e PARA se alguma falhar. Confirmar?')) return; rel.busy=true; rel.err=''; try{ const r=await api('/release',{method:'POST',body:JSON.stringify({vms})}); rel.running=r; relPoll(r.id); }catch(e){ rel.err=e.message; } rel.busy=false; };

        const copied = ref('');
        const copy = (txt, id) => { try{ navigator.clipboard.writeText(txt); copied.value=id; setTimeout(()=>copied.value='',1600); }catch(e){} };
        const gen = reactive({ name:'', tok:'', id:'', busy:false, err:'' });
        const genConnectToken = async () => {
          gen.err=''; gen.busy=true;
          try{
            const nm = (gen.name||'').trim() || (me.value && me.value.name) || 'dev';
            const t = await api('/tokens',{method:'POST',body:JSON.stringify({name:nm, role:'operator'})});
            gen.tok = t.token; gen.id = t.id; gen.name = nm;
          }catch(e){ gen.err = e.message || 'erro ao gerar token'; }
          gen.busy=false;
        };
        const tokOr = () => gen.tok || 'SEU_TOKEN';
        const addCmd = computed(()=> `claude mcp add --transport http almirante https://painel.chatspx.app/mcp --header "Authorization: Bearer ${tokOr()}" --scope user`);
        const claudePrompt = computed(()=> {
          const troca = gen.tok ? 'Esse token já é meu — é só rodar o comando.' : 'Troque SEU_TOKEN pela minha chave.';
          return `Conecte o MCP "almirante" no meu Claude Code, do zero. Rode no terminal:

claude mcp add --transport http almirante https://painel.chatspx.app/mcp --header "Authorization: Bearer ${tokOr()}" --scope user

${troca} Depois rode \`claude mcp list\` pra confirmar (deve aparecer "almirante: connected") e me avise.

O almirante comanda a frota ChatSPX — deploy E governança de IA (prompt/tools/credencial dos agentes). Regra de ouro: você PROPÕE, um humano APROVA no painel (https://painel.chatspx.app). Nunca presuma que executou.`;
        });

        // ── IA / Agentes ──
        const ai = reactive({ vms:[], assistants:[], vm:'', aid:'', base:null, prompt:'', busy:false, res:null, hist:[], tab:'prompt', faq:{q:'',a:''}, cred:{provider:'',settings:'',enabled:true} });
        const aiLoadVms = async () => { try{ ai.vms = ((await api('/ai/agents')).vms)||[]; if(!ai.vm && ai.vms[0]) ai.vm = ai.vms[0].id; aiLoadAssistants(); }catch(e){ msg.value=e.message; } };
        const aiLoadAssistants = async () => { ai.assistants=[]; if(!ai.vm) return; try{ ai.assistants = ((await api('/ai/assistants?vm='+ai.vm)).assistants)||[]; if(ai.assistants.length && !ai.assistants.find(a=>String(a.id)===String(ai.aid))) ai.aid = ai.assistants[0].id; }catch(e){} };
        const aiPromptText = (b)=> (b && (b.instructions || (b.config && b.config.instructions) || b.prompt)) || '';
        const aiTools = computed(()=> { const b=ai.base||{}; return b.tools || (b.config&&b.config.tools) || []; });
        const aiLoadAgent = async () => {
          if(!ai.vm || !ai.aid){ msg.value='escolha a VM e o ID do agente'; return; }
          ai.busy=true; ai.res=null; ai.base=null;
          try{ ai.base = await api('/ai/agents/'+ai.vm+'/'+ai.aid); ai.prompt = aiPromptText(ai.base); aiLoadHist(); }
          catch(e){ msg.value=e.message; }
          ai.busy=false;
        };
        const aiWrite = async (path, body, okMsg) => {
          ai.busy=true; ai.res=null;
          try{ const r = await api('/ai/'+path,{method:'POST',body:JSON.stringify(body)}); ai.res = { ok:r.status==='applied', ...r, _msg:okMsg }; aiLoadHist(); }
          catch(e){ ai.res = { ok:false, error:e.message }; }
          ai.busy=false;
        };
        const aiSavePrompt = () => { if(!ai.prompt.trim()){ msg.value='prompt vazio'; return; } if(!confirm('Aplicar o novo prompt do agente '+ai.aid+' na '+ai.vm+'?\\n\\nPassa pelo test-gate antes; é auditado e reversível.')) return; aiWrite('prompt',{vm:ai.vm,assistant_id:+ai.aid,instructions:ai.prompt},'Prompt aplicado'); };
        const aiSetTool = (toolId, armed) => aiWrite('tool',{vm:ai.vm,assistant_id:+ai.aid,tool_id:toolId,armed},(armed?'Tool armada':'Tool desarmada'));
        const aiAddFaq = () => { if(!ai.faq.q||!ai.faq.a){ msg.value='pergunta e resposta obrigatórias'; return; } aiWrite('faq',{vm:ai.vm,assistant_id:+ai.aid,question:ai.faq.q,answer:ai.faq.a},'FAQ adicionada').then(()=>{ai.faq={q:'',a:''};}); };
        const aiSetCred = () => { let s={}; try{ s=ai.cred.settings?JSON.parse(ai.cred.settings):{}; }catch(e){ msg.value='settings deve ser JSON válido'; return; } aiWrite('credential',{vm:ai.vm,provider:ai.cred.provider,settings:s,enabled:ai.cred.enabled},'Credencial testada e salva'); };
        const aiLoadHist = async () => { try{ ai.hist = ((await api('/ai/history?vm='+ai.vm)).change_sets)||[]; }catch(e){} };
        const aiRollback = async (csid) => { if(!confirm('Reverter o change-set '+csid+'? Restaura o estado anterior na VM.')) return; try{ await api('/ai/rollback',{method:'POST',body:JSON.stringify({vm:ai.vm,change_set_id:csid})}); aiLoadHist(); if(ai.aid) aiLoadAgent(); }catch(e){ msg.value=e.message; } };

        // ── GitHub ──
        const gh = reactive({ repos:[], repo:'', tab:'prs', state:'open', prs:[], issues:[], branches:[], sel:null, busy:false, res:null, form:{ title:'', body:'', head:'', base:'producao' }, comment:'' });
        const ghRefresh = async () => { if(!gh.repo || gh.tab==='new') return; gh.busy=true; gh.sel=null; try{

              </div>

                <button v-if="gh.sel.kind==='pr' && me.role==='admin'" @click="ghMerge" :disabled="gh.busy" class="press font-bold rounded-xl px-4 py-2 text-sm flex items-center gap-1.5" style="background:rgb(16 185 129/.14);color:#10B981"><ic n="check-circle" cls="w-4 h-4"/>Merge</button>

              </div>
            </div>

            <div v-if="gh.tab==='prs' && !gh.sel" class="glass rounded-2xl overflow-hidden">

                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase shrink-0" :style="p.state==='open'?'background:rgb(16 185 129/.12);color:#10B981':'background:rgb(148 163 184/.15);color:#94A3B8'">{{ p.state }}</span>
              </button>
            </div>

            <div v-if="gh.tab==='issues' && !gh.sel" class="glass rounded-2xl overflow-hidden">
              <div v-if="gh.busy" class="tx3 text-sm py-8 text-center">carregando…</div>

                <div class="min-w-0 flex items-center gap-3"><ic n="warning-octagon" cls="w-4 h-4 text-brand shrink-0"/><div class="min-w-0"><div class="font-semibold text-sm tx1 truncate">{{ it.title }}</div><div class="tx3 text-xs truncate">#{{ it.number }} · {{ it.user&&it.user.login }}</div></div></div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase shrink-0" :style="it.state==='open'?'background:rgb(16 185 129/.12);color:#10B981':'background:rgb(148 163 184/.15);color:#94A3B8'">{{ it.state }}</span>
              </button>
            </div>

            <div v-if="gh.tab==='branches' && !gh.sel" class="glass rounded-2xl p-3">

            </div>

            <div v-if="gh.tab==='new'" class="glass rounded-2xl p-5 grid md:grid-cols-2 gap-6">
              <div>
                <div class="text-[11px] uppercase tracking-wider text-brand font-bold mb-2 flex items-center gap-1.5"><ic n="warning-octagon" cls="w-4 h-4"/>Nova issue</div>

                <textarea v-model="gh.form.body" rows="4" class="field w-full px-3 py-2.5 text-sm" placeholder="descrição (opcional)"></textarea>
                <div class="flex justify-end mt-3"><button @click="ghNewIssue" :disabled="gh.busy" class="press btn-brand font-bold rounded-xl px-5 py-2.5 text-sm flex items-center gap-2 disabled:opacity-60"><ic n="plus" cls="w-4 h-4"/>Abrir issue</button></div>
              </div>
              <div class="md:border-l hair md:pl-6">
                <div class="text-[11px] uppercase tracking-wider text-brand font-bold mb-2 flex items-center gap-1.5"><ic n="arrows-clockwise" cls="w-4 h-4"/>Novo PR</div>
                <input v-model="gh.form.title" class="field w-full mb-2 px-3 py-2.5 text-sm" placeholder="título do PR" />
                <div class="grid grid-cols-2 gap-2 mb-2"><input v-model="gh.form.head" class="field px-3 py-2.5 text-sm font-mono" placeholder="head (branch)" /><input v-model="gh.form.base" class="field px-3 py-2.5 text-sm font-mono" placeholder="base" /></div>
                <textarea v-model="gh.form.body" rows="3" class="field w-full px-3 py-2.5 text-sm" placeholder="descrição"></textarea>
                <div class="flex justify-end mt-3"><button @click="ghNewPR" :disabled="gh.busy" class="press btn-brand font-bold rounded-xl px-5 py-2.5 text-sm flex items-center gap-2 disabled:opacity-60"><ic n="arrows-clockwise" cls="w-4 h-4"/>Abrir PR</button></div>
              </div>
            </div>

              <div class="relative">
                <div class="text-[11px] font-bold uppercase tracking-[.25em] text-brand flex items-center gap-2"><ic n="gauge" cls="w-4 h-4"/>Mission Control · ChatSPX</div>

                  <div class="soft rounded-2xl px-4 py-2.5"><div class="font-display font-extrabold text-2xl text-ok">{{ onlineCount }}</div><div class="text-[11px] tx3 font-semibold uppercase tracking-wide">no ar</div></div>
                  <div class="soft rounded-2xl px-4 py-2.5"><div class="font-display font-extrabold text-2xl text-brand">{{ pending.length }}</div><div class="text-[11px] tx3 font-semibold uppercase tracking-wide">aguardando</div></div>
                  <div class="soft rounded-2xl px-4 py-2.5"><div class="font-display font-extrabold text-2xl text-violet">{{ fleet.length }}</div><div class="text-[11px] tx3 font-semibold uppercase tracking-wide">VMs</div></div>
                </div>
              </div>
            </div>
            <div v-for="(vms, env, gi) in byEnv" :key="env" class="mb-8">
              <div class="flex items-center gap-2 mb-3 px-1"><ic :n="envStyle(env).icon" cls="w-4 h-4 tx3"/><h3 class="text-[12px] uppercase tracking-[.16em] tx3 font-bold">{{ env }}</h3><div class="flex-1 h-px hair" style="border-top-width:1px"></div></div>
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 items-start">
                <div v-for="(vm,i) in vms" :key="vm.id" @mouseenter="loadMetrics(vm.id)" class="card glass rounded-2xl p-5 relative overflow-hidden rise" :style="{ animationDelay:(gi*50+i*40)+'ms' }">
                  <ic :n="envStyle(vm.env).icon" :class="['absolute -right-4 -bottom-5 w-32 h-32 pointer-events-none select-none', envStyle(vm.env).text]" style="opacity:.08"/>

                    <div class="flex items-start gap-3">
                      <div :class="['w-11 h-11 rounded-xl grid place-items-center shrink-0', envStyle(vm.env).chip]"><ic :n="envStyle(vm.env).icon" cls="w-5 h-5"/></div>
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2"><span class="font-display font-bold text-[17px] tx1 truncate">{{ vm.name }}</span><span v-if="vm.critical" class="text-[9px] font-bold rounded-full px-1.5 py-0.5 uppercase" style="background:rgb(239 68 68/.12);color:#EF4444">crítica</span></div>
                        <div class="text-xs tx3 font-medium mt-0.5">{{ vm.env }} · {{ vm.branch }}</div>
                      </div>
                      <span class="w-2.5 h-2.5 rounded-full mt-1 shrink-0" :class="(status[vm.id]&&status[vm.id].online)?'bg-ok live':'bg-brand/30'"></span>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                      <span class="font-mono text-xs rounded-lg px-2 py-1 tx2 soft">{{ (status[vm.id]&&status[vm.id].commit)||'·······' }}</span>
                      <span class="text-[11px] font-bold flex items-center gap-1" :class="(status[vm.id]&&status[vm.id].online)?'text-ok':'tx3'"><ic n="broadcast" cls="w-3.5 h-3.5"/>{{ (status[vm.id]&&status[vm.id].online)?'online':'—' }}</span>
                    </div>
                    <div class="expand">
                      <div class="h-px my-1 hair" style="border-top-width:1px"></div>
                      <div v-if="!mstate[vm.id] || mstate[vm.id]==='loading'" class="grid grid-cols-3 gap-2.5 mt-2"><div v-for="i in 3" :key="i" class="skel h-9"></div></div>
                      <div v-else-if="mstate[vm.id]!=='ok'" class="mt-2 flex items-center gap-2 text-[11px] tx3"><ic n="warning-octagon" cls="w-3.5 h-3.5"/><span>{{ mstate[vm.id]==='error' ? 'métricas indisponíveis' : 'sem métricas nesta VM' }}</span><button v-if="mstate[vm.id]==='error'" @click.stop="retryMetrics(vm.id)" class="text-brand hover:underline font-semibold">tentar de novo</button></div>
                      <template v-else>
                        <div class="grid grid-cols-3 gap-2.5 mt-2">
                          <div v-for="m in [{k:'cpu',l:'CPU'},{k:'ram',l:'RAM'},{k:'disk',l:'Disco'}]" :key="m.k">
                            <div class="flex justify-between items-baseline"><span class="text-[10px] uppercase tracking-wider tx3 font-bold">{{ m.l }}</span><span class="font-mono text-[11px] tx2">{{ metrics[vm.id][m.k]!=null ? metrics[vm.id][m.k]+'%' : '—' }}</span></div>
                            <div class="mbar mt-1"><span :style="{ width: (metrics[vm.id][m.k]||0)+'%' }"></span></div>
                          </div>
                        </div>
                        <div class="flex items-center gap-4 mt-3 text-[11px] tx2 font-medium"><span class="flex items-center gap-1.5"><ic n="clock-counter-clockwise" cls="w-3.5 h-3.5 text-brand"/>{{ metrics[vm.id].uptime }}</span><span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full" :class="metrics[vm.id].service_active?'bg-ok':'bg-brand/30'"></span>serviço</span></div>
                      </template>
                      <div class="flex gap-2 mt-3">
                        <button @click.stop="restartVM(vm.id,'chatwoot-web.1.service','web · '+vm.name)" class="press flex-1 text-[11px] font-bold rounded-lg py-2 flex items-center justify-center gap-1 text-brand" style="background:rgb(99 102 241/.1);border:1px solid rgb(99 102 241/.22)"><ic n="arrows-clockwise" cls="w-3.5 h-3.5"/>web</button>
                        <button @click.stop="restartVM(vm.id,'chatwoot-worker.1.service','worker · '+vm.name)" class="press flex-1 text-[11px] font-bold rounded-lg py-2 flex items-center justify-center gap-1 text-violet" style="background:rgb(139 92 246/.1);border:1px solid rgb(139 92 246/.22)"><ic n="arrows-clockwise" cls="w-3.5 h-3.5"/>worker</button>
                        <button @click.stop="restartVM(vm.id,'chatwoot.target','tudo · '+vm.name)" class="press flex-1 text-[11px] font-bold rounded-lg py-2 flex items-center justify-center gap-1 tx2 soft"><ic n="arrows-clockwise" cls="w-3.5 h-3.5"/>tudo</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <p v-if="!fleet.length" class="tx3 text-sm">Carregando frota… (confira seu token na barra lateral)</p>
          </div>

          <!-- APROVAÇÕES -->
          <div v-else-if="view==='aprovacoes'">
            <div v-if="!pending.length" class="glass rounded-3xl p-12 text-center"><div class="w-16 h-16 rounded-3xl grid place-items-center mx-auto mb-3" style="background:rgb(16 185 129/.12)"><ic n="shield-check" cls="w-9 h-9 text-ok"/></div><p class="tx2 font-medium">Nenhuma operação aguardando autorização.</p></div>
            <div v-for="(d,i) in pending" :key="d.id" class="card glass rounded-2xl p-5 mb-4 rise flex flex-col md:flex-row md:items-center justify-between gap-4" :style="{ animationDelay:(i*50)+'ms' }">
              <div class="flex items-start gap-3">
                <div class="w-11 h-11 rounded-xl grid place-items-center shrink-0" style="background:rgb(99 102 241/.12);color:#6366F1"><ic n="rocket-launch" cls="w-5 h-5"/></div>

                  <div class="font-display font-bold text-lg flex items-center gap-2 flex-wrap tx1">{{ d.vm }}<span class="font-mono text-xs tx3 font-normal">{{ d.current_sha }} → {{ d.target_sha }}</span></div>
                  <div class="text-xs tx3 mt-1 flex items-center gap-2 flex-wrap font-medium">por <b class="tx1">{{ d.requested_by }}</b> · {{ (d.migrations||[]).length }} migration(s)<span v-if="d.has_destructive" class="rounded-full px-2 py-0.5 flex items-center gap-1 font-bold" style="background:rgb(239 68 68/.12);color:#EF4444"><ic n="warning-octagon" cls="w-3.5 h-3.5"/>DESTRUTIVA</span></div>
                </div>
              </div>
              <div class="flex gap-2 shrink-0">
                <button @click="act(d.id,'approve')" class="press font-bold rounded-full px-6 py-3 text-sm flex items-center gap-2 text-white" style="background:#10B981;box-shadow:0 8px 22px rgb(16 185 129/.3)"><ic n="check-circle" cls="w-5 h-5"/>Aprovar</button>
                <button @click="act(d.id,'reject')" class="press btn-ghost hover:text-bad font-bold rounded-full px-5 py-3 text-sm flex items-center gap-2"><ic n="x-circle" cls="w-5 h-5"/>Rejeitar</button>
              </div>
            </div>
          </div>

          <!-- HISTÓRICO -->
          <div v-else-if="view==='historico'" class="glass rounded-2xl overflow-hidden rise">
            <table class="w-full text-sm">
              <thead class="tx3 text-[11px] uppercase tracking-wider font-bold soft"><tr class="text-left"><th class="px-5 py-3.5">VM</th><th>Mudança</th><th>Autor / Aprovou</th><th>Status</th></tr></thead>
              <tbody>
                <tr v-for="d in recent" :key="d.id" class="border-t hair"><td class="px-5 py-3 font-bold tx1">{{ d.vm }}</td><td class="font-mono text-xs tx2">{{ d.current_sha }}→{{ d.target_sha }}</td><td class="text-xs tx3 font-medium">{{ d.requested_by }} / {{ d.approved_by||'—' }}</td><td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full" :class="d.status==='success'?'text-ok':'tx3'" :style="d.status==='success'?'background:rgb(16 185 129/.12)':'background:rgb(148 163 184/.12)'">{{ d.status }}</span></td></tr>
                <tr v-if="!recent.length"><td colspan="4" class="px-5 py-8 tx3 text-sm text-center">Sem histórico ainda.</td></tr>
              </tbody>
            </table>
          </div>

          <!-- TOKENS -->
          <div v-else-if="view==='tokens'">
            <div class="flex justify-end mb-4"><button @click="newToken" class="press btn-brand font-bold rounded-full px-5 py-2.5 text-sm flex items-center gap-2"><ic n="plus" cls="w-4 h-4"/>Novo token</button></div>
            <div class="glass rounded-2xl overflow-hidden rise">
              <table class="w-full text-sm">
                <thead class="tx3 text-[11px] uppercase tracking-wider font-bold soft"><tr class="text-left"><th class="px-5 py-3.5">Dev</th><th>Papel</th><th>Dispositivo (PC)</th><th>Último acesso</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="t in tokens" :key="t.id" class="border-t hair" :class="{'opacity-40':t.revoked}"><td class="px-5 py-3 font-bold tx1">{{ t.name }} <span class="tx3 font-mono text-xs font-normal">{{ t.secret }}</span></td><td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tx2 soft">{{ t.role }}</span></td><td class="font-mono text-xs tx2 flex items-center gap-1.5 py-3"><ic n="hard-drives" cls="w-4 h-4 tx3"/>{{ t.last_host||'—' }} <span class="tx3">{{ t.last_ip }}</span></td><td class="text-xs tx3 font-medium">{{ t.last_seen?relTime(t.last_seen):'nunca usou' }}</td><td class="text-right pr-5"><button v-if="!t.revoked" @click="revokeToken(t.id)" class="press text-bad hover:opacity-80 text-xs font-bold flex items-center gap-1 ml-auto"><ic n="prohibit" cls="w-3.5 h-3.5"/>Revogar</button><span v-else class="tx3 text-xs">revogado</span></td></tr>
                  <tr v-if="!tokens.length"><td colspan="5" class="px-5 py-8 tx3 text-sm text-center">Nenhum token emitido. Clique "Novo token".</td></tr>
                </tbody>
              </table>
            </div>
            <p class="tx3 text-xs mt-3 px-1 font-medium">O dev cola o token no <code class="text-brand font-bold">.mcp.json</code>; na 1ª chamada o painel registra o <b class="tx1">PC</b> (hostname/IP). Revogar corta o acesso na hora.</p>
          </div>

          <!-- USUÁRIOS -->
          <div v-else-if="view==='usuarios'">
            <div class="flex justify-end mb-4"><button @click="addUser" class="press btn-brand font-bold rounded-full px-5 py-2.5 text-sm flex items-center gap-2"><ic n="plus" cls="w-4 h-4"/>Convidar usuário</button></div>
            <div class="glass rounded-2xl overflow-hidden rise">
              <table class="w-full text-sm">
                <thead class="tx3 text-[11px] uppercase tracking-wider font-bold soft"><tr class="text-left"><th class="px-5 py-3.5">Usuário</th><th>Papel</th><th>Status</th><th>Último login</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="u in usersList" :key="u.id" class="border-t hair">
                    <td class="px-5 py-3"><div class="font-bold tx1">{{ u.name||u.email }}</div><div class="text-xs tx3 font-mono">{{ u.email }}</div></td>
                    <td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tx2 soft">{{ u.role }}</span></td>
                    <td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full" :class="u.status==='active'?'text-ok':'text-warn'" :style="u.status==='active'?'background:rgb(16 185 129/.12)':'background:rgb(245 158 11/.12)'">{{ u.status==='active'?'ativo':'convidado' }}</span></td>
                    <td class="text-xs tx3 font-medium">{{ u.last_login?relTime(u.last_login):'—' }}</td>
                    <td class="text-right pr-5"><button @click="delUser(u.id)" class="press text-bad hover:opacity-80 text-xs font-bold flex items-center gap-1 ml-auto"><ic n="prohibit" cls="w-3.5 h-3.5"/>Remover</button></td>
                  </tr>
                  <tr v-if="!usersList.length"><td colspan="5" class="px-5 py-8 tx3 text-sm text-center">Nenhum usuário. Clique "Convidar usuário".</td></tr>
                </tbody>
              </table>
            </div>
            <p class="tx3 text-xs mt-3 px-1 font-medium">Ao convidar, a pessoa recebe um <b class="tx1">email</b> pra definir a senha (link expira em 48h). Login é por <b class="tx1">email + senha</b>.</p>
          </div>

          <!-- RELEASE -->
          <div v-else-if="view==='release'" class="max-w-3xl space-y-4 rise">
            <div class="glass rounded-2xl p-6 relative overflow-hidden">
              <ic n="rocket-launch" cls="absolute right-2 -bottom-6 w-32 h-32 text-brand pointer-events-none" style="opacity:.07"/>
              <h2 class="font-display font-extrabold text-2xl tx1 flex items-center gap-2 relative"><ic n="rocket-launch" cls="w-6 h-6 text-brand"/>Release pra produção</h2>
              <p class="tx2 text-sm mt-2 max-w-lg relative">Escolha as máquinas → veja o preview → solte. O rollout é <b class="tx1">sequencial com health-check</b>: deploya uma de cada vez e <b class="tx1">para tudo</b> se alguma falhar.</p>
            </div>
            <div class="glass rounded-2xl p-6">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-display font-bold text-lg tx1">Máquinas afetadas</h3>
                <div class="flex gap-3 text-[12px] font-bold"><button @click="relGroup('all')" class="press text-brand">todas</button><button @click="relClear()" class="press tx3">limpar</button></div>
              </div>
              <div v-for="(vms,env) in byEnv" :key="env" class="mb-3">
                <div class="text-[10px] uppercase tracking-wider tx3 font-bold mb-1.5 flex items-center gap-2">{{ env }} <button @click="relGroup(env)" class="press text-brand normal-case tracking-normal lowercase">+ grupo</button></div>
                <div class="flex flex-wrap gap-2">
                  <button v-for="vm in vms" :key="vm.id" @click="relToggle(vm.id)" class="press text-[13px] font-bold rounded-lg px-3 py-1.5 border transition" :style="rel.sel[vm.id]?'background:#6366F1;border-color:#6366F1;color:#fff':'background:rgb(var(--surface)/.5);border-color:rgb(var(--hair)/.14)'" :class="!rel.sel[vm.id]&&'tx1'">{{ vm.name }}</button>
                </div>
              </div>
              <div class="flex gap-2 mt-4">
                <button @click="relDry()" :disabled="rel.busy" class="press btn-ghost font-bold rounded-lg px-4 py-2 text-sm disabled:opacity-50">{{ rel.busy?'…':'Preview (dry-run)' }}</button>
                <button @click="relGo()" :disabled="rel.busy" class="press font-bold rounded-lg px-5 py-2 text-sm flex items-center gap-2 disabled:opacity-50 text-white" style="background:#10B981;box-shadow:0 6px 18px rgb(16 185 129/.25)"><ic n="rocket-launch" cls="w-4 h-4"/>Soltar Release</button>
              </div>
              <p v-if="rel.err" class="text-xs mt-2 text-bad">⚠️ {{ rel.err }}</p>
            </div>
            <div v-if="rel.dry.length" class="glass rounded-2xl p-6">
              <h3 class="font-display font-bold text-lg tx1 mb-3">Preview (nada enfileirado)</h3>
              <div class="space-y-1.5 text-[13px] font-mono">
                <div v-for="d in rel.dry" :key="d.vm" class="flex flex-wrap items-center gap-2 tx2">
                  <span class="w-28 tx1 font-bold">{{ d.vm }}</span><span>{{ d.current_sha }} → {{ d.target_sha||'?' }}</span>
                  <span v-if="!d.behind" class="text-ok">· em dia</span>
                  <span v-if="d.migrations" :class="d.destructive?'text-bad':'tx3'">· {{ d.migrations }} migr{{ d.destructive?' ⚠️ DESTRUTIVA':'' }}</span>
                  <span v-if="d.frozen" class="text-bad">· 🧊 congelada</span>
                </div>
              </div>
            </div>
            <div v-if="rel.running" class="glass rounded-2xl p-6">
              <h3 class="font-display font-bold text-lg tx1 mb-1 flex items-center gap-2">Rollout {{ rel.running.id }} <span :class="rel.running.status==='success'?'text-ok':(rel.running.status==='failed'?'text-bad':'text-brand')">· {{ rel.running.status }}</span></h3>
              <div class="space-y-1.5 mt-3 text-sm">
                <div v-for="r in rel.running.results" :key="r.vm" class="flex items-center gap-2"><span class="w-5 text-center">{{ r.status==='success'?'✅':(r.status==='failed'?'❌':(r.status==='executing'?'⏳':(r.status==='skipped'?'⏭️':'·'))) }}</span><span class="w-28 tx1 font-bold">{{ r.vm }}</span><span class="tx3 text-[13px] truncate">{{ r.status }}{{ r.detail?' — '+r.detail.slice(0,70):'' }}</span></div>
              </div>
            </div>
          </div>

          <!-- CONECTAR -->
          <div v-else-if="view==='conectar'" class="max-w-3xl space-y-4 rise">
            <div class="glass rounded-2xl p-6 relative overflow-hidden">
              <ic n="plugs-connected" cls="absolute right-2 -bottom-6 w-32 h-32 text-violet pointer-events-none" style="opacity:.07"/>
              <div class="relative">
                <div class="text-[11px] font-bold uppercase tracking-[.18em] text-brand flex items-center gap-1.5"><ic n="plugs-connected" cls="w-4 h-4"/>Onboarding</div>
                <h2 class="font-display font-extrabold text-2xl tx1 mt-2">Conecte o Almirante ao Claude Code</h2>
                <p class="tx2 text-sm mt-2 max-w-lg">3 passos e você comanda a frota (deploy + IA) falando natural — a IA <b class="tx1">propõe</b>, um humano <b class="tx1">aprova</b> aqui.</p>
              </div>
            </div>
            <div class="glass rounded-2xl p-6 flex gap-4">
              <div class="w-8 h-8 rounded-full grid place-items-center font-display font-extrabold text-sm shrink-0 btn-brand">1</div>
              <div class="flex-1 min-w-0">
                <h3 class="font-display font-bold text-lg tx1">Gere seu token</h3>
                <template v-if="me && me.role==='admin'">
                  <p class="tx2 text-sm mt-1 mb-3">Crie aqui mesmo — ele já entra no comando do passo 2.</p>
                  <div v-if="!gen.tok" class="flex flex-wrap items-center gap-2">
                    <input v-model="gen.name" @keyup.enter="genConnectToken" placeholder="nome do dev (opcional)" class="field px-3 py-2 text-sm flex-1 min-w-[180px]"/>
                    <button @click="genConnectToken" :disabled="gen.busy" class="press btn-brand font-bold rounded-lg px-4 py-2 text-sm flex items-center gap-1.5 disabled:opacity-60"><ic n="key" cls="w-4 h-4"/>{{ gen.busy ? 'gerando…' : 'Gerar token' }}</button>
                  </div>
                  <div v-else class="rounded-xl p-3 flex flex-wrap items-center gap-x-2 gap-y-1" style="background:rgb(16 185 129/.1);border:1px solid rgb(16 185 129/.25)">
                    <ic n="shield-check" cls="w-4 h-4 text-ok shrink-0"/><span class="text-sm tx1">Token de <b>{{ gen.name }}</b> <b>já injetado</b> no comando abaixo.</span>
                    <button @click="copy(gen.tok,'tok')" class="press ml-auto text-[12px] font-bold text-brand flex items-center gap-1">{{ copied==='tok' ? 'copiado ✓' : 'copiar só o token' }}</button>
                    <button @click="gen.tok='';gen.name=''" class="press text-[12px] font-bold tx3">gerar outro</button>
                  </div>
                  <p v-if="gen.err" class="text-xs mt-2 text-bad">⚠️ {{ gen.err }}</p>
                </template>
                <template v-else><p class="tx2 text-sm mt-1">Peça um token a um <b class="tx1">admin</b> e use no lugar de <b class="text-brand">SEU_TOKEN</b> abaixo.</p></template>
              </div>
            </div>
            <div class="glass rounded-2xl p-6 flex gap-4">
              <div class="w-8 h-8 rounded-full grid place-items-center font-display font-extrabold text-sm shrink-0 btn-brand">2</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2"><h3 class="font-display font-bold text-lg tx1">Conecte com <span class="text-brand">1 comando</span></h3><button @click="copy(addCmd,'cmd')" class="press text-[12px] font-bold rounded-lg px-3 py-1.5 flex items-center gap-1.5 shrink-0" style="background:rgb(99 102 241/.12);color:#6366F1;border:1px solid rgb(99 102 241/.25)"><ic n="terminal-window" cls="w-3.5 h-3.5"/>{{ copied==='cmd' ? 'copiado ✓' : 'copiar' }}</button></div>
                <p class="tx2 text-sm mt-1 mb-3">Rode no terminal — <b class="tx1">sem binário, sem editar arquivo</b>, em qualquer SO.</p>
                <pre class="rounded-xl p-4 text-xs overflow-x-auto leading-relaxed soft tx2">{{ addCmd }}</pre>
              </div>
            </div>
            <div class="glass rounded-2xl p-6 flex gap-4">
              <div class="w-8 h-8 rounded-full grid place-items-center font-display font-extrabold text-sm shrink-0 btn-brand">3</div>
              <div class="flex-1">
                <h3 class="font-display font-bold text-lg tx1">Fale natural</h3>
                <p class="tx2 text-sm mt-1 mb-3">Sem decorar comando:</p>
                <div class="space-y-3">
                  <div><div class="text-[10px] uppercase tracking-wider tx3 font-bold mb-1.5">Deploy</div><div class="flex flex-wrap gap-1.5"><span class="chip">"status da tozi?"</span><span class="chip">"atualiza a homologação"</span><span class="chip">"rollback da tozi"</span></div></div>
                  <div><div class="text-[10px] uppercase tracking-wider tx3 font-bold mb-1.5">IA</div><div class="flex flex-wrap gap-1.5"><span class="chip">"mostra o prompt da Clara"</span><span class="chip">"arma a tool de agendamento"</span><span class="chip">"histórico de mudanças da IA"</span></div></div>
                </div>
                <p class="tx3 text-xs mt-4 flex items-center gap-1.5"><ic n="shield-check" cls="w-3.5 h-3.5 text-ok"/>Tudo que muda algo passa por test-gate/aprovação. A IA nunca executa sozinha.</p>
              </div>
            </div>
            <div class="glass rounded-2xl p-6">
              <div class="flex items-center justify-between gap-2 mb-1"><h3 class="font-display font-bold text-lg tx1 flex items-center gap-2"><div class="w-8 h-8 rounded-xl grid place-items-center" style="background:rgb(139 92 246/.14);color:#8B5CF6"><ic n="sparkle" cls="w-4 h-4"/></div>Prefere pedir pro Claude? Cole isto</h3><button @click="copy(claudePrompt,'prompt')" class="press text-[12px] font-bold rounded-lg px-3 py-1.5 flex items-center gap-1.5 shrink-0" style="background:rgb(139 92 246/.14);color:#8B5CF6;border:1px solid rgb(139 92 246/.3)"><ic n="terminal-window" cls="w-3.5 h-3.5"/>{{ copied==='prompt' ? 'copiado ✓' : 'copiar prompt' }}</button></div>
              <pre class="rounded-xl p-4 text-[11px] overflow-x-auto leading-relaxed whitespace-pre-wrap soft tx2">{{ claudePrompt }}</pre>
            </div>
            <div class="glass rounded-2xl p-6 relative overflow-hidden">
              <h3 class="font-display font-bold text-lg mb-3 flex items-center gap-2 tx1"><ic n="terminal-window" cls="w-5 h-5 text-brand"/>Tools disponíveis</h3>
              <div class="grid md:grid-cols-2 gap-4 text-xs tx3 font-medium">
                <div><b class="tx1">Observabilidade</b><br/>fleet_status · vm_status · vm_health · migration_status · git_diff · deploy_history · version_matrix · drift_check</div>
                <div><b class="tx1">Deploy &amp; Merge</b><br/>propose_deploy_vm · propose_deploy_all · propose_deploy_group · dry_run · <b class="text-brand">propose_merge</b></div>
                <div><b class="tx1">Ciclo-de-vida</b><br/>propose_restart · propose_migrate · propose_precompile · propose_rollback · freeze/unfreeze</div>
                <div><b class="text-brand">IA · Agentes</b><br/>ai_list_agents · ai_get_agent · ai_update_prompt · ai_set_tool · ai_set_credential · ai_add_faq · ai_history · ai_rollback</div>
              </div>
            </div>
          </div>
        </main>
        </div>
      </div>
      `
    }).component('ic', Icon).mount('#app');
  </script>
</body>
</html>
