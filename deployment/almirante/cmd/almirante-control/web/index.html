    .glass{ background:linear-gradient(180deg, rgba(22,32,58,.55), rgba(15,23,42,.5)); border:1px solid rgba(148,163,184,.12); backdrop-filter:blur(12px); }
    .glass:hover{ border-color:rgba(56,189,248,.32); }

    .navp.on{ background:linear-gradient(90deg, rgba(34,211,238,.16), rgba(34,211,238,0)); color:#67E8F9; box-shadow:inset 2px 0 0 #22D3EE; }
    .card{ transition:transform .2s cubic-bezier(.2,.7,.2,1), border-color .2s, box-shadow .2s; }
    .card:hover{ transform:translateY(-3px); box-shadow:0 18px 40px rgba(2,6,18,.5), 0 0 0 1px rgba(56,189,248,.25), 0 8px 28px rgba(34,211,238,.10); }

    .mbar{ height:6px; border-radius:9999px; background:rgba(8,12,20,.6); overflow:hidden; }
    .mbar>span{ display:block; height:100%; border-radius:9999px; background:linear-gradient(90deg,#22D3EE,#4F46E5); transition:width .6s cubic-bezier(.2,.8,.2,1); }
    .press:active{ transform:scale(.96); }

  <div id="app" v-cloak></div>

  <script>
    const { createApp, ref, reactive, onMounted, computed } = Vue;
    const Icon = { props:{ n:String, cls:{type:String, default:'w-5 h-5'} },
      template:'<svg :class="cls" fill="currentColor" aria-hidden="true"><use :href="\'#i-\'+n"></use></svg>' };

    createApp({
      setup() {
        const token = ref(localStorage.getItem('alm_token') || '');
        const me = ref(null);
        const setpwToken = ref(new URLSearchParams(location.search).get('setpw') || '');
        const li = reactive({ email:'', pass:'', err:'', busy:false });
        const sp = reactive({ pass:'', pass2:'', err:'', busy:false });
        const usersList = ref([]);
        const view = ref('frota');
        const fleet = ref([]); const status = reactive({}); const metrics = reactive({}); const deploys = ref([]); const tokens = ref([]); const msg = ref('');

        const api = async (path, opts={}) => {
          const r = await fetch('/api'+path, { ...opts, headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token.value } });
          if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ('HTTP '+r.status));
          return r.json();
        };
        const saveToken = () => { localStorage.setItem('alm_token', token.value); refresh(); };
        const refresh = async () => {
          msg.value='';
          try {
            fleet.value = ((await api('/fleet')).vms) || [];
            deploys.value = (await api('/deploys')) || [];
            for (const vm of fleet.value)
              api('/vms/'+vm.id+'/status').then(s=>{ status[vm.id]=s; }).catch(()=>{ status[vm.id]={online:false}; });
          } catch(e){ msg.value=e.message; }
        };
        const pending = computed(()=> (deploys.value||[]).filter(d=>d.status==='pending'));
        const recent = computed(()=> (deploys.value||[]).filter(d=>d.status!=='pending').slice(0,12));
        const byEnv = computed(()=>{ const g={}; for (const v of fleet.value) (g[v.env]=g[v.env]||[]).push(v); return g; });
        const onlineCount = computed(()=> fleet.value.filter(v=> status[v.id] && status[v.id].online).length);

        const act = async (id, action) => { try{ await api('/deploys/'+id+'/'+action,{method:'POST'}); await refresh(); }catch(e){ msg.value=e.message; } };
        const loadTokens = async () => { try{ tokens.value = (await api('/tokens')) || []; }catch(e){ msg.value=e.message; } };
        const newToken = async () => {
          const name=prompt('Nome do dev:'); if(!name) return;
          const role=prompt('Papel (viewer / operator / admin):','operator')||'operator';
          try{ const t=await api('/tokens',{method:'POST',body:JSON.stringify({name,role})}); window.prompt('Token de '+name+' — copie AGORA (não será mostrado de novo):',t.token); loadTokens(); }
          catch(e){ msg.value=e.message; }
        };
        const revokeToken = async (id) => { if(!confirm('Revogar o token '+id+'?')) return; try{ await api('/tokens/'+id,{method:'DELETE'}); loadTokens(); }catch(e){ msg.value=e.message; } };
        const go = (v)=>{ view.value=v; if(v==='tokens') loadTokens(); if(v==='usuarios') loadUsers(); };
        // ---- auth de humano ----
        const checkMe = async () => { try{ me.value = await api('/me'); refresh(); }catch(e){ me.value=null; } };
        const doLogin = async () => { li.err=''; li.busy=true; try{ me.value = await api('/login',{method:'POST',body:JSON.stringify({email:li.email,password:li.pass})}); li.pass=''; refresh(); }catch(e){ li.err='Email ou senha inválidos'; } li.busy=false; };
        const doSetPw = async () => { sp.err=''; if(sp.pass.length<8){sp.err='Mínimo 8 caracteres';return;} if(sp.pass!==sp.pass2){sp.err='As senhas não conferem';return;} sp.busy=true; try{ me.value = await api('/set-password',{method:'POST',body:JSON.stringify({token:setpwToken.value,password:sp.pass})}); setpwToken.value=''; history.replaceState({},'',location.pathname); refresh(); }catch(e){ sp.err=e.message; } sp.busy=false; };
        const logout = async () => { try{ await api('/logout',{method:'POST'}); }catch(e){} me.value=null; token.value=''; localStorage.removeItem('alm_token'); };
        const tokenLogin = () => { const t=prompt('Cole seu token (MCP / emergência):'); if(!t) return; token.value=t.trim(); localStorage.setItem('alm_token',token.value); checkMe(); };
        const loadUsers = async () => { try{ usersList.value = (await api('/users'))||[]; }catch(e){ msg.value=e.message; } };

            <div class="glass rounded-2xl overflow-hidden rise">
              <table class="w-full text-sm">
                <thead class="text-t3 text-[11px] uppercase tracking-wider font-bold" style="background:rgba(8,12,20,.4)"><tr class="text-left"><th class="px-5 py-3.5">Dev</th><th>Papel</th><th>Dispositivo (PC)</th><th>Último acesso</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="t in tokens" :key="t.id" class="border-t" style="border-color:rgba(148,163,184,.08)" :class="{'opacity-40':t.revoked}"><td class="px-5 py-3 font-bold text-t1">{{ t.name }} <span class="text-t3 font-mono text-xs font-normal">{{ t.secret }}</span></td><td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full uppercase text-t2" style="background:rgba(100,116,139,.15)">{{ t.role }}</span></td><td class="font-mono text-xs text-t2 flex items-center gap-1.5 py-3"><ic n="hard-drives" cls="w-4 h-4 text-t3"/>{{ t.last_host||'—' }} <span class="text-t3">{{ t.last_ip }}</span></td><td class="text-xs text-t3 font-medium">{{ t.last_seen?relTime(t.last_seen):'nunca usou' }}</td><td class="text-right pr-5"><button v-if="!t.revoked" @click="revokeToken(t.id)" class="press text-bad hover:opacity-80 text-xs font-bold flex items-center gap-1 ml-auto"><ic n="prohibit" cls="w-3.5 h-3.5"/>Revogar</button><span v-else class="text-t3 text-xs">revogado</span></td></tr>
                  <tr v-if="!tokens.length"><td colspan="5" class="px-5 py-8 text-t3 text-sm text-center">Nenhum token emitido. Clique "Novo token".</td></tr>
                </tbody>
              </table>
            </div>
            <p class="text-t3 text-xs mt-3 px-1 font-medium">O dev cola o token no <code class="text-accentsoft font-bold">.mcp.json</code>; na 1ª chamada o painel registra o <b class="text-t1">PC</b> (hostname/IP). Revogar corta o acesso na hora.</p>
          </div>

          <!-- CONECTAR -->
          <div v-else-if="view==='usuarios'">
            <div class="flex justify-end mb-4"><button @click="addUser" class="press text-void font-bold rounded-full px-5 py-2.5 text-sm flex items-center gap-2" style="background:linear-gradient(120deg,#22D3EE,#4F46E5);box-shadow:0 8px 22px rgba(34,211,238,.3)"><ic n="plus" cls="w-4 h-4"/>Convidar usuário</button></div>
            <div class="glass rounded-2xl overflow-hidden rise">
              <table class="w-full text-sm">
                <thead class="text-t3 text-[11px] uppercase tracking-wider font-bold" style="background:rgba(8,12,20,.4)"><tr class="text-left"><th class="px-5 py-3.5">Usuário</th><th>Papel</th><th>Status</th><th>Último login</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="u in usersList" :key="u.id" class="border-t" style="border-color:rgba(148,163,184,.08)">
                    <td class="px-5 py-3"><div class="font-bold text-t1">{{ u.name||u.email }}</div><div class="text-xs text-t3 font-mono">{{ u.email }}</div></td>
                    <td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full uppercase text-t2" style="background:rgba(100,116,139,.15)">{{ u.role }}</span></td>
                    <td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full" :class="u.status==='active'?'text-ok':'text-warn'" :style="u.status==='active'?'background:rgba(76,195,138,.12)':'background:rgba(232,199,106,.12)'">{{ u.status==='active'?'ativo':'convidado' }}</span></td>
                    <td class="text-xs text-t3 font-medium">{{ u.last_login?relTime(u.last_login):'—' }}</td>
                    <td class="text-right pr-5"><button @click="delUser(u.id)" class="press text-bad hover:opacity-80 text-xs font-bold flex items-center gap-1 ml-auto"><ic n="prohibit" cls="w-3.5 h-3.5"/>Remover</button></td>
                  </tr>
                  <tr v-if="!usersList.length"><td colspan="5" class="px-5 py-8 text-t3 text-sm text-center">Nenhum usuário. Clique "Convidar usuário".</td></tr>
                </tbody>
              </table>
            </div>
            <p class="text-t3 text-xs mt-3 px-1 font-medium">Ao convidar, a pessoa recebe um <b class="text-t1">email</b> pra definir a senha (link expira em 48h). Login é por <b class="text-t1">email + senha</b>.</p>
          </div>

          <div v-else-if="view==='conectar'" class="max-w-3xl space-y-4 rise">
            <div class="glass rounded-2xl p-6 relative overflow-hidden">
              <ic n="plugs-connected-d" cls="absolute right-2 -bottom-6 w-32 h-32 text-violet pointer-events-none" style="opacity:.08"/>
              <h2 class="font-display font-bold text-xl mb-1 flex items-center gap-2 relative text-t1"><div class="w-9 h-9 rounded-xl grid place-items-center" style="background:rgba(129,140,248,.14);color:#818CF8"><ic n="plugs-connected" cls="w-5 h-5"/></div>Plugar no Claude Code</h2>
              <p class="text-t2 text-sm mb-3 mt-2 font-medium relative">Cole no <code class="text-accentsoft font-bold">.mcp.json</code> do projeto e troque o token:</p>
              <pre class="rounded-2xl p-4 text-xs overflow-x-auto leading-relaxed relative" style="background:#05070D;border:1px solid rgba(148,163,184,.1);color:#94A3B8">{
  "mcpServers": {
    "almirante": {
      "command": "/usr/local/bin/almirante-mcp",
      "env": {
        "ALMIRANTE_MOCK": "0",
        "ALMIRANTE_CONTROL_URL": "https://painel.chatspx.app",
        "ALMIRANTE_DEV_TOKEN": "SEU_TOKEN_AQUI"
      }
    }
  }
}</pre>
              <p class="text-t2 text-sm mt-4 mb-2 font-medium relative">Depois é só <b class="text-t1">falar natural</b>:</p>
              <div class="space-y-1.5 text-sm font-medium relative">
                <div class="flex items-center gap-2 text-t2"><ic n="caret-right" cls="w-4 h-4 text-accent"/>"qual o status da tozi?" · "quem precisa de deploy?"</div>
                <div class="flex items-center gap-2 text-t2"><ic n="caret-right" cls="w-4 h-4 text-accent"/>"atualiza a homologação" · "reinicia a fábrica"</div>
                <div class="flex items-center gap-2 text-t2"><ic n="caret-right" cls="w-4 h-4 text-accent"/>"promove a homologação pra produção" · "rollback da tozi"</div>
              </div>
            </div>
            <div class="glass rounded-2xl p-6 relative overflow-hidden">
              <ic n="terminal-window-d" cls="absolute right-2 -bottom-6 w-32 h-32 text-accent pointer-events-none" style="opacity:.07"/>
              <h3 class="font-display font-bold text-lg mb-3 flex items-center gap-2 relative text-t1"><div class="w-9 h-9 rounded-xl grid place-items-center" style="background:rgba(34,211,238,.12);color:#22D3EE"><ic n="terminal-window" cls="w-5 h-5"/></div>Tools</h3>
              <div class="grid md:grid-cols-2 gap-4 text-xs text-t3 font-medium relative">
                <div><b class="text-t1">Observabilidade</b><br/>fleet_status · vm_status · vm_health · migration_status · git_diff · deploy_history · version_matrix · drift_check · disk_usage · service_status · list_pending · whoami</div>
                <div><b class="text-t1">Deploy &amp; Merge</b><br/>propose_deploy_vm · propose_deploy_all · propose_deploy_group · dry_run · <b class="text-accentsoft">propose_merge</b></div>
                <div><b class="text-t1">Ciclo-de-vida</b><br/>propose_restart_vm · propose_restart_service · propose_migrate · propose_precompile · propose_rollback</div>
                <div><b class="text-t1">Manutenção</b><br/>freeze_deploys · unfreeze_deploys · freeze_status · cancel_request · deploy_logs · service_logs</div>
              </div>
              <p class="text-t3 text-xs mt-4 pt-3 font-medium relative" style="border-top:1px solid rgba(148,163,184,.1)">A IA <b class="text-t1">propõe</b>; nenhuma tool executa ou aprova sozinha — quem autoriza é um humano (gate fora do LLM).</p>
            </div>
          </div>
        </main>
        </div>
      </div>
      `
    }).component('ic', Icon).mount('#app');
  </script>
</body>
</html>
