  <div id="app" v-cloak></div>

  <script>
    const { createApp, ref, reactive, onMounted, computed } = Vue;
    const Icon = { props:{ n:String, cls:{type:String, default:'w-5 h-5'} },
      template:'<svg :class="cls" fill="currentColor" aria-hidden="true"><use :href="\'#i-\'+n"></use></svg>' };

    createApp({
      setup() {
        const token = ref(localStorage.getItem('alm_token') || 'dev-demo-token');
        const view = ref('frota');
        const fleet = ref([]); const status = reactive({}); const deploys = ref([]); const tokens = ref([]); const msg = ref('');

        const api = async (path, opts={}) => {
          const r = await fetch('/api'+path, { ...opts, headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token.value } });
          if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ('HTTP '+r.status));
          return r.json();
        };
        const saveToken = () => { localStorage.setItem('alm_token', token.value); refresh(); };
        const refresh = async () => {
          msg.value='';
          try {
            fleet.value = (await api('/fleet')).vms || [];
            deploys.value = (await api('/deploys')) || [];
            for (const vm of fleet.value)
              api('/vms/'+vm.id+'/status').then(s=>{ status[vm.id]=s; }).catch(()=>{ status[vm.id]={online:false}; });
          } catch(e){ msg.value=e.message; }
        };
        const pending = computed(()=> (deploys.value||[]).filter(d=>d.status==='pending'));
        const recent = computed(()=> (deploys.value||[]).filter(d=>d.status!=='pending').slice(0,12));
        const byEnv = computed(()=>{ const g={}; for (const v of fleet.value) (g[v.env]=g[v.env]||[]).push(v); return g; });
        const onlineCount = computed(()=> fleet.value.filter(v=> status[v.id] && status[v.id].online).length);

        const act = async (id, action) => { try{ await api('/deploys/'+id+'/'+action,{method:'POST'}); await refresh(); }catch(e){ msg.value=e.message; } };
        const loadTokens = async () => { try{ tokens.value = (await api('/tokens')) || []; }catch(e){ msg.value=e.message; } };
        const newToken = async () => {
          const name=prompt('Nome do dev:'); if(!name) return;
          const role=prompt('Papel (viewer / operator / admin):','operator')||'operator';
          try{ const t=await api('/tokens',{method:'POST',body:JSON.stringify({name,role})}); window.prompt('Token de '+name+' — copie AGORA (não será mostrado de novo):',t.token); loadTokens(); }
          catch(e){ msg.value=e.message; }
        };
        const revokeToken = async (id) => { if(!confirm('Revogar o token '+id+'?')) return; try{ await api('/tokens/'+id,{method:'DELETE'}); loadTokens(); }catch(e){ msg.value=e.message; } };
        const go = (v)=>{ view.value=v; if(v==='tokens') loadTokens(); };

        // ícone + cor por ambiente (chip dos cards, estilo iFood)
        const envStyle = (env)=>{
          if(/AWS/i.test(env)) return { icon:'cloud', chip:'bg-blue-50 text-blue-500' };
          if(/Dev/i.test(env)) return { icon:'cpu', chip:'bg-violet-50 text-violet-500' };
          return { icon:'hard-drives', chip:'bg-indigo-50 text-indigo-500' }; // Proxmox
        };
        const relTime = (s)=> s ? s.slice(0,16).replace('T',' ') : '—';
        const titleOf = { frota:'Frota', aprovacoes:'Aprovações', historico:'Histórico', tokens:'Tokens & Dispositivos', conectar:'Como conectar' };

        onMounted(refresh);
        return { token, saveToken, view, go, fleet, status, deploys, tokens, msg, refresh, pending, recent, byEnv, onlineCount, act, loadTokens, newToken, revokeToken, envStyle, relTime, titleOf };
      },
      template: `
      <div class="flex min-h-screen">
        <!-- Sidebar clara -->
        <aside class="w-60 shrink-0 bg-white border-r border-line flex flex-col fixed h-screen">
          <div class="px-5 py-5 flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-coral-500 to-coral-700 grid place-items-center shadow-glow"><ic n="anchor" cls="w-6 h-6 text-white"/></div>
            <div><div class="font-display font-extrabold text-[19px] leading-none">Almirante</div><div class="text-[11px] text-mute mt-1 font-medium">Comando da Frota</div></div>
          </div>
          <nav class="px-3 mt-3 space-y-1 text-sm font-semibold">
            <button @click="go('frota')" :class="['navp w-full text-left rounded-2xl px-3.5 py-2.5 flex items-center gap-3', view==='frota'?'bg-coral-50 text-coral-600':'text-slate-500 hover:bg-slate-50']"><ic n="anchor" cls="w-5 h-5"/><span class="flex-1">Frota</span><span class="text-xs font-mono opacity-70">{{ onlineCount }}/{{ fleet.length }}</span></button>
            <button @click="go('aprovacoes')" :class="['navp w-full text-left rounded-2xl px-3.5 py-2.5 flex items-center gap-3', view==='aprovacoes'?'bg-coral-50 text-coral-600':'text-slate-500 hover:bg-slate-50']"><ic n="bell" cls="w-5 h-5"/><span class="flex-1">Aprovações</span><span v-if="pending.length" class="text-[11px] font-bold bg-coral-500 text-white rounded-full px-1.5 py-0.5">{{ pending.length }}</span></button>
            <button @click="go('historico')" :class="['navp w-full text-left rounded-2xl px-3.5 py-2.5 flex items-center gap-3', view==='historico'?'bg-coral-50 text-coral-600':'text-slate-500 hover:bg-slate-50']"><ic n="clock-counter-clockwise" cls="w-5 h-5"/><span>Histórico</span></button>
            <button @click="go('tokens')" :class="['navp w-full text-left rounded-2xl px-3.5 py-2.5 flex items-center gap-3', view==='tokens'?'bg-coral-50 text-coral-600':'text-slate-500 hover:bg-slate-50']"><ic n="key" cls="w-5 h-5"/><span>Tokens</span></button>
            <button @click="go('conectar')" :class="['navp w-full text-left rounded-2xl px-3.5 py-2.5 flex items-center gap-3', view==='conectar'?'bg-coral-50 text-coral-600':'text-slate-500 hover:bg-slate-50']"><ic n="plugs-connected" cls="w-5 h-5"/><span>Como conectar</span></button>
          </nav>
          <div class="mt-auto p-4">
            <div class="rounded-2xl bg-slate-50 p-3">
              <label class="text-[10px] uppercase tracking-wider text-mute font-bold">Seu token</label>
              <div class="flex gap-1.5 mt-1.5">
                <input v-model="token" @keyup.enter="saveToken" class="flex-1 w-0 bg-white border border-line rounded-xl px-2.5 py-1.5 text-xs font-mono focus:border-coral-500 outline-none" />
                <button @click="saveToken" class="press text-xs bg-coral-500 hover:bg-coral-600 text-white font-bold rounded-xl px-3">ok</button>
              </div>
              <button @click="refresh" class="press mt-2 w-full flex items-center justify-center gap-1.5 text-xs text-mute hover:text-coral-600 font-semibold"><ic n="arrows-clockwise" cls="w-3.5 h-3.5"/>atualizar</button>
            </div>
          </div>
        </aside>

        <main class="flex-1 ml-60 px-8 py-7 max-w-[1320px]">
          <div class="flex items-center justify-between mb-6">
            <h1 class="font-display font-extrabold text-[28px] tracking-tight">{{ titleOf[view] }}</h1>
            <div class="flex items-center gap-2 bg-white rounded-full pl-2.5 pr-3.5 py-1.5 shadow-soft text-sm font-semibold"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 live"></span>{{ onlineCount }}/{{ fleet.length }} no ar</div>
          </div>
          <p v-if="msg" class="mb-5 text-rose-600 text-sm bg-rose-50 border border-rose-100 rounded-2xl px-4 py-2.5 flex items-center gap-2 font-medium"><ic n="warning-octagon" cls="w-4 h-4"/>{{ msg }}</p>

          <!-- FROTA -->
          <div v-if="view==='frota'">
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-coral-500 to-coral-700 text-white p-7 mb-7 shadow-glow rise">
              <ic n="anchor-d" cls="absolute -right-4 -bottom-6 w-44 h-44 text-white/10"/>
              <div class="relative">
                <div class="text-[11px] font-bold uppercase tracking-[.18em] text-white/80 flex items-center gap-1.5"><ic n="gauge" cls="w-4 h-4"/>Mission Control · ChatSPX</div>
                <h2 class="font-display font-extrabold text-3xl mt-2">{{ onlineCount }} de {{ fleet.length }} embarcações no ar</h2>
                <p class="text-white/85 text-sm mt-1 max-w-md">Inspecione, promova e autorize operações — tudo sob o gate humano.</p>
                <div class="flex gap-3 mt-5">
                  <div class="bg-white/15 backdrop-blur rounded-2xl px-4 py-2.5"><div class="font-display font-extrabold text-2xl">{{ onlineCount }}</div><div class="text-[11px] text-white/80 font-semibold uppercase tracking-wide">no ar</div></div>
                  <div class="bg-white/15 backdrop-blur rounded-2xl px-4 py-2.5"><div class="font-display font-extrabold text-2xl">{{ pending.length }}</div><div class="text-[11px] text-white/80 font-semibold uppercase tracking-wide">aguardando</div></div>
                  <div class="bg-white/15 backdrop-blur rounded-2xl px-4 py-2.5"><div class="font-display font-extrabold text-2xl">{{ fleet.length }}</div><div class="text-[11px] text-white/80 font-semibold uppercase tracking-wide">VMs</div></div>
                </div>
              </div>
            </div>
            <div v-for="(vms, env, gi) in byEnv" :key="env" class="mb-7">
              <div class="flex items-center gap-2 mb-3 px-1"><ic :n="envStyle(env).icon" cls="w-4 h-4 text-mute"/><h3 class="text-[12px] uppercase tracking-[.14em] text-mute font-bold">{{ env }}</h3><span class="text-mute/60 text-xs font-semibold">· {{ vms.length }}</span></div>
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <div v-for="(vm,i) in vms" :key="vm.id" class="card bg-white rounded-3xl p-5 shadow-soft hover:shadow-lift rise" :style="{ animationDelay:(gi*50+i*40)+'ms' }">
                  <div class="flex items-start gap-3">
                    <div :class="['w-12 h-12 rounded-2xl grid place-items-center shrink-0', envStyle(vm.env).chip]"><ic :n="envStyle(vm.env).icon" cls="w-6 h-6"/></div>
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-2"><span class="font-display font-bold text-[17px] truncate">{{ vm.name }}</span><span v-if="vm.critical" class="text-[9px] font-bold text-rose-500 bg-rose-50 rounded-full px-1.5 py-0.5 uppercase">crítica</span></div>
                      <div class="text-xs text-mute font-medium mt-0.5">{{ vm.env }} · {{ vm.branch }}</div>
                    </div>
                    <span class="w-2.5 h-2.5 rounded-full mt-1 shrink-0" :class="(status[vm.id]&&status[vm.id].online)?'bg-emerald-500 live':'bg-slate-300'"></span>
                  </div>
                  <div class="mt-4 flex items-center justify-between">
                    <span class="font-mono text-xs bg-slate-50 text-slate-500 rounded-lg px-2 py-1">{{ (status[vm.id]&&status[vm.id].commit)||'·······' }}</span>
                    <span class="text-[11px] font-bold flex items-center gap-1" :class="(status[vm.id]&&status[vm.id].online)?'text-emerald-600':'text-slate-400'"><ic n="broadcast" cls="w-3.5 h-3.5"/>{{ (status[vm.id]&&status[vm.id].online)?'online':'—' }}</span>
                  </div>
                </div>
              </div>
            </div>
            <p v-if="!fleet.length" class="text-mute text-sm">Carregando frota… (confira seu token na barra lateral)</p>
          </div>

          <!-- APROVAÇÕES -->
          <div v-else-if="view==='aprovacoes'">
            <div v-if="!pending.length" class="bg-white rounded-3xl p-12 text-center shadow-soft"><div class="w-16 h-16 rounded-3xl bg-emerald-50 grid place-items-center mx-auto mb-3"><ic n="shield-check-d" cls="w-9 h-9 text-emerald-500"/></div><p class="text-mute font-medium">Nenhuma operação aguardando autorização.</p></div>
            <div v-for="(d,i) in pending" :key="d.id" class="bg-white rounded-3xl p-5 mb-4 shadow-soft rise flex flex-col md:flex-row md:items-center justify-between gap-4" :style="{ animationDelay:(i*50)+'ms' }">
              <div class="flex items-start gap-3">
                <div class="w-12 h-12 rounded-2xl bg-coral-50 text-coral-600 grid place-items-center shrink-0"><ic n="rocket-launch" cls="w-6 h-6"/></div>
                <div>
                  <div class="font-display font-bold text-lg flex items-center gap-2 flex-wrap">{{ d.vm }}<span class="font-mono text-xs text-mute font-normal">{{ d.current_sha }} → {{ d.target_sha }}</span></div>
                  <div class="text-xs text-mute mt-1 flex items-center gap-2 flex-wrap font-medium">por <b class="text-ink">{{ d.requested_by }}</b> · {{ (d.migrations||[]).length }} migration(s)<span v-if="d.has_destructive" class="text-rose-600 bg-rose-50 rounded-full px-2 py-0.5 flex items-center gap-1 font-bold"><ic n="warning-octagon" cls="w-3.5 h-3.5"/>DESTRUTIVA</span></div>
                </div>
              </div>
              <div class="flex gap-2 shrink-0">
                <button @click="act(d.id,'approve')" class="press bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl px-5 py-3 text-sm flex items-center gap-2 shadow-soft"><ic n="check-circle" cls="w-5 h-5"/>Aprovar</button>
                <button @click="act(d.id,'reject')" class="press border-2 border-line hover:border-rose-200 hover:text-rose-600 text-mute font-bold rounded-2xl px-4 py-3 text-sm flex items-center gap-2"><ic n="x-circle" cls="w-5 h-5"/>Rejeitar</button>
              </div>
            </div>
          </div>

          <!-- HISTÓRICO -->
          <div v-else-if="view==='historico'" class="bg-white rounded-3xl shadow-soft overflow-hidden rise">
            <table class="w-full text-sm">
              <thead class="text-mute text-[11px] uppercase tracking-wider font-bold bg-slate-50/60"><tr class="text-left"><th class="px-5 py-3.5">VM</th><th>Mudança</th><th>Autor / Aprovou</th><th>Status</th></tr></thead>
              <tbody>
                <tr v-for="d in recent" :key="d.id" class="border-t border-line hover:bg-slate-50/50"><td class="px-5 py-3 font-bold">{{ d.vm }}</td><td class="font-mono text-xs text-mute">{{ d.current_sha }}→{{ d.target_sha }}</td><td class="text-xs text-mute font-medium">{{ d.requested_by }} / {{ d.approved_by||'—' }}</td><td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full" :class="d.status==='success'?'bg-emerald-50 text-emerald-600':'bg-slate-100 text-slate-500'">{{ d.status }}</span></td></tr>
                <tr v-if="!recent.length"><td colspan="4" class="px-5 py-8 text-mute text-sm text-center">Sem histórico ainda.</td></tr>
              </tbody>
            </table>
          </div>

          <!-- TOKENS -->
          <div v-else-if="view==='tokens'">
            <div class="flex justify-end mb-4"><button @click="newToken" class="press bg-coral-500 hover:bg-coral-600 text-white font-bold rounded-2xl px-4 py-2.5 text-sm flex items-center gap-2 shadow-glow"><ic n="plus" cls="w-4 h-4"/>Novo token</button></div>
            <div class="bg-white rounded-3xl shadow-soft overflow-hidden rise">
              <table class="w-full text-sm">
                <thead class="text-mute text-[11px] uppercase tracking-wider font-bold bg-slate-50/60"><tr class="text-left"><th class="px-5 py-3.5">Dev</th><th>Papel</th><th>Dispositivo (PC)</th><th>Último acesso</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="t in tokens" :key="t.id" class="border-t border-line" :class="{'opacity-40':t.revoked}"><td class="px-5 py-3 font-bold">{{ t.name }} <span class="text-slate-400 font-mono text-xs font-normal">{{ t.secret }}</span></td><td><span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 uppercase">{{ t.role }}</span></td><td class="font-mono text-xs text-mute flex items-center gap-1.5 py-3"><ic n="hard-drives" cls="w-4 h-4 text-slate-300"/>{{ t.last_host||'—' }} <span class="text-slate-400">{{ t.last_ip }}</span></td><td class="text-xs text-mute font-medium">{{ t.last_seen?relTime(t.last_seen):'nunca usou' }}</td><td class="text-right pr-5"><button v-if="!t.revoked" @click="revokeToken(t.id)" class="press text-rose-500 hover:text-rose-600 text-xs font-bold flex items-center gap-1 ml-auto"><ic n="prohibit" cls="w-3.5 h-3.5"/>Revogar</button><span v-else class="text-mute text-xs">revogado</span></td></tr>
                  <tr v-if="!tokens.length"><td colspan="5" class="px-5 py-8 text-mute text-sm text-center">Nenhum token emitido. Clique "Novo token".</td></tr>
                </tbody>
              </table>
            </div>
            <p class="text-mute text-xs mt-3 px-1 font-medium">O dev cola o token no <code class="text-coral-600 font-bold">.mcp.json</code>; na 1ª chamada o painel registra o <b class="text-ink">PC</b> (hostname/IP). Revogar corta o acesso na hora.</p>
          </div>

          <!-- CONECTAR -->
          <div v-else-if="view==='conectar'" class="max-w-3xl space-y-4 rise">
            <div class="bg-white rounded-3xl p-6 shadow-soft">
              <h2 class="font-display font-bold text-xl mb-1 flex items-center gap-2"><div class="w-9 h-9 rounded-xl bg-violet-50 text-violet-500 grid place-items-center"><ic n="plugs-connected" cls="w-5 h-5"/></div>Plugar no Claude Code</h2>
              <p class="text-mute text-sm mb-3 mt-2 font-medium">Cole no <code class="text-coral-600 font-bold">.mcp.json</code> do projeto e troque o token:</p>
              <pre class="bg-ink text-slate-100 rounded-2xl p-4 text-xs overflow-x-auto leading-relaxed">{
  "mcpServers": {
    "almirante": {
      "command": "/usr/local/bin/almirante-mcp",
      "env": {
        "ALMIRANTE_MOCK": "0",
        "ALMIRANTE_CONTROL_URL": "https://painel.chatspx.app",
        "ALMIRANTE_DEV_TOKEN": "SEU_TOKEN_AQUI"
      }
    }
  }
}</pre>
              <p class="text-mute text-sm mt-4 mb-2 font-medium">Depois é só <b class="text-ink">falar natural</b>:</p>
              <div class="space-y-1.5 text-sm font-medium">
                <div class="flex items-center gap-2 text-slate-600"><ic n="caret-right" cls="w-4 h-4 text-coral-500"/>"qual o status da tozi?" · "quem precisa de deploy?"</div>
                <div class="flex items-center gap-2 text-slate-600"><ic n="caret-right" cls="w-4 h-4 text-coral-500"/>"atualiza a homologação" · "reinicia a fábrica"</div>
                <div class="flex items-center gap-2 text-slate-600"><ic n="caret-right" cls="w-4 h-4 text-coral-500"/>"promove a homologação pra produção" · "rollback da tozi"</div>
              </div>
            </div>
            <div class="bg-white rounded-3xl p-6 shadow-soft">
              <h3 class="font-display font-bold text-lg mb-3 flex items-center gap-2"><div class="w-9 h-9 rounded-xl bg-coral-50 text-coral-600 grid place-items-center"><ic n="terminal-window" cls="w-5 h-5"/></div>Tools</h3>
              <div class="grid md:grid-cols-2 gap-4 text-xs text-mute font-medium">
                <div><b class="text-ink">Observabilidade</b><br/>fleet_status · vm_status · vm_health · migration_status · git_diff · deploy_history · version_matrix · drift_check · disk_usage · service_status · list_pending · whoami</div>
                <div><b class="text-ink">Deploy &amp; Merge</b><br/>propose_deploy_vm · propose_deploy_all · propose_deploy_group · dry_run · <b class="text-coral-600">propose_merge</b></div>
                <div><b class="text-ink">Ciclo-de-vida</b><br/>propose_restart_vm · propose_restart_service · propose_migrate · propose_precompile · propose_rollback</div>
                <div><b class="text-ink">Manutenção</b><br/>freeze_deploys · unfreeze_deploys · freeze_status · cancel_request · deploy_logs · service_logs</div>
              </div>
              <p class="text-mute text-xs mt-4 pt-3 border-t border-line font-medium">A IA <b class="text-ink">propõe</b>; nenhuma tool executa ou aprova sozinha — quem autoriza é um humano (gate fora do LLM).</p>
            </div>
          </div>
        </main>
      </div>
      `
    }).component('ic', Icon).mount('#app');
  </script>
</body>
</html>
