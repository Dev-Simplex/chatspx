# Almirante — CI/CD (GitHub Actions) — TEMPLATE
#
# Este arquivo NAO esta ativo. E um TEMPLATE: copie-o para
# `.github/workflows/almirante.yml` na RAIZ do repo para ativa-lo.
# (Mantemos aqui em deployment/almirante/ci/ para nao mexer no .github
#  do repo raiz a partir da frente de CI/CD do Almirante.)
#
# Como ativar:
#   cp deployment/almirante/ci/almirante.yml .github/workflows/almirante.yml
#   git add .github/workflows/almirante.yml && git commit -m "ci(almirante): activate workflow"
#
# O job de release (goreleaser) so dispara em push de tag `almirante-v*`.
name: almirante

on:
  push:
    branches: [producao, develop]
    # Só roda quando algo dentro do projeto Almirante muda.
    paths:
      - "deployment/almirante/**"
    tags:
      - "almirante-v*"
  pull_request:
    paths:
      - "deployment/almirante/**"

# O modulo Go vive num subdiretorio do monorepo.
defaults:
  run:
    working-directory: deployment/almirante

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  # ---------------------------------------------------------------------------
  # Lint + test + build. Roda em push (paths) e em PR.
  # ---------------------------------------------------------------------------
  build-test:
    name: vet · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Cache do modulo Go; chave pelo go.sum do subdir.
          cache-dependency-path: deployment/almirante/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

  # ---------------------------------------------------------------------------
  # Release com GoReleaser. SO em push de tag `almirante-v*`.
  # Precisa do job de build-test verde antes.
  # ---------------------------------------------------------------------------
  release:
    name: goreleaser (tag)
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/almirante-v')
    permissions:
      contents: write # criar o GitHub Release + upload de artefatos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser precisa do historico completo p/ changelog.
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: deployment/almirante/go.sum

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          # Roda dentro do subdir do modulo.
          workdir: deployment/almirante
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
