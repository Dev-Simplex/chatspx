<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Chat SPX — Referência da API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Documentação oficial da API do Chat SPX" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; }
      /* Marca Chat SPX — verde #2dc46f */
      .scalar-app { --scalar-color-accent: #2dc46f; --scalar-color-accent-rgb: 45, 196, 111; }
      .dark-mode .scalar-app { --scalar-color-accent: #2dc46f; }
    </style>
  </head>
  <body>
    <script id="api-reference" data-url="/swagger/swagger.json"></script>
    <script>
      var configuration = {
        theme: 'default',
        layout: 'modern',
        darkMode: true,
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        hideDownloadButton: false,
        searchHotKey: 'k',
        metaData: { title: 'Chat SPX — API', description: 'Referência completa da API do Chat SPX' },
        customCss:
          '.scalar-app{--scalar-color-accent:#2dc46f;--scalar-color-accent-rgb:45,196,111;}' +
          '.dark-mode{--scalar-color-accent:#2dc46f;}',
      };
      document.getElementById('api-reference').dataset.configuration = JSON.stringify(configuration);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
