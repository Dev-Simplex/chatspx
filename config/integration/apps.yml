######  Attributes Supported by Integration Apps #######
# id: Internal Id for the integrations, used by the hooks
# logo: place the image in /public/dashboard/images/integrations and reference here
# i18n_key: the key under which translations for the integration is placed in en.yml
# action: if integration requires external redirect url
# hook_type: ( account / inbox )
# feature_flag: (string) feature flag to enable/disable the integration
# allow_multiple_hooks: whether multiple hooks can be created for the integration
# settings_json_schema: the json schema used to validate the settings hash (https://json-schema.org/)
# settings_form_schema: the formulate schema used in frontend to render settings form (https://vueformulate.com/)
########################################################
webhooks:
  id: webhook
  logo: webhooks.png
  i18n_key: webhooks
  action: /webhook
  hook_type: account
  allow_multiple_hooks: true
dashboard_apps:
  id: dashboard_apps
  logo: dashboard_apps.png
  i18n_key: dashboard_apps
  hook_type: account
  allow_multiple_hooks: true
openai:
  id: openai
  logo: openai.png
  i18n_key: openai
  action: /openai
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'api_key': { 'type': 'string' },
          'label_suggestion': { 'type': 'boolean' },
        },
      'required': ['api_key'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'API Key',
        'type': 'text',
        'name': 'api_key',
        'validation': 'required',
      },
      {
        'label': 'Show label suggestions',
        'type': 'checkbox',
        'name': 'label_suggestion',
        'validation': '',
      },
    ]
  visible_properties: ['label_suggestion']
linear:
  id: linear
  logo: linear.png
  i18n_key: linear
  action: https://linear.app/oauth/authorize
  hook_type: account
  allow_multiple_hooks: false
notion:
  id: notion
  logo: notion.png
  i18n_key: notion
  hook_type: account
  allow_multiple_hooks: false
slack:
  id: slack
  logo: slack.png
  i18n_key: slack
  action: https://slack.com/oauth/v2/authorize?scope=commands,chat:write,channels:read,channels:manage,channels:join,groups:read,groups:write,im:write,mpim:write,users:read,users:read.email,chat:write.customize,channels:history,groups:history,mpim:history,im:history,files:read,files:write
  hook_type: account
  allow_multiple_hooks: false
dialogflow:
  id: dialogflow
  logo: dialogflow.png
  i18n_key: dialogflow
  action: /dialogflow
  hook_type: inbox
  allow_multiple_hooks: true
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'project_id': { 'type': 'string' },
          'credentials': { 'type': 'object' },
          'region': { 'type': 'string' },
        },
      'required': ['project_id', 'credentials'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Dialogflow Project ID',
        'type': 'text',
        'name': 'project_id',
        'validation': 'required',
        'validationName': 'Project Id',
      },
      {
        'label': 'Dialogflow Project Key File',
        'type': 'textarea',
        'name': 'credentials',
        'validation': 'required|JSON',
        'validationName': 'Credentials',
        'validation-messages':
          { 'JSON': 'Invalid JSON', 'required': 'Credentials is required' },
      },
      {
        'label': 'Dialogflow Region',
        'type': 'select',
        'name': 'region',
        'default': 'global',
        'options': [
          { 'label': 'Global - Default', 'value': 'global' },
          { 'label': 'AS-NE1 - Tokyo, Japan', 'value': 'asia-northeast1' },
          { 'label': 'AU-SE1 - Sydney, Australia', 'value': 'australia-southeast1' },
          { 'label': 'EU-W1 - St. Ghislain, Belgium', 'value': 'europe-west1' },
          { 'label': 'EU-W2 - London, England', 'value': 'europe-west2' },
        ],
      },
    ]
  visible_properties: ['project_id', 'region']
google_translate:
  id: google_translate
  logo: google-translate.png
  i18n_key: google_translate
  action: /google_translate
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'project_id': { 'type': 'string' },
          'credentials': { 'type': 'object' },
        },
      'required': ['project_id', 'credentials'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Google Cloud Project ID',
        'type': 'text',
        'name': 'project_id',
        'validation': 'required',
        'validationName': 'Project Id',
      },
      {
        'label': 'Google Cloud Project Key File',
        'type': 'textarea',
        'name': 'credentials',
        'validation': 'required|JSON',
        'validationName': 'Credentials',
        'validation-messages':
          { 'JSON': 'Invalid JSON', 'required': 'Credentials is required' },
      },
    ]
  visible_properties: ['project_id']
dyte:
  id: dyte
  logo: dyte.png
  i18n_key: dyte
  action: /dyte
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'api_key': { 'type': 'string' },
          'organization_id': { 'type': 'string' },
        },
      'required': ['api_key', 'organization_id'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Organization ID',
        'type': 'text',
        'name': 'organization_id',
        'validation': 'required',
      },
      {
        'label': 'API Key',
        'type': 'text',
        'name': 'api_key',
        'validation': 'required',
      },
    ]
  visible_properties: ['organization_id']

shopify:
  id: shopify
  logo: shopify.png
  i18n_key: shopify
  hook_type: account
  allow_multiple_hooks: false

meta_lead_ads:
  id: meta_lead_ads
  logo: meta_lead_ads.png
  i18n_key: meta_lead_ads
  hook_type: account
  allow_multiple_hooks: true
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'page_id': { 'type': 'string' },
          'page_name': { 'type': 'string' },
          'verify_token': { 'type': 'string' },
          'app_secret': { 'type': 'string' },
          'page_access_token': { 'type': 'string' },
          'target_inbox_id': { 'type': ['integer', 'string'] },
          'initial_message_template': { 'type': 'string' },
          'whatsapp_template_name': { 'type': 'string' },
          'whatsapp_template_locale': { 'type': 'string' },
          'whatsapp_template_body_fields': { 'type': 'string' },
          'skip_initial_message': { 'type': 'boolean' },
          'enabled': { 'type': 'boolean' },
        },
      'required':
        ['page_id', 'verify_token', 'app_secret', 'page_access_token', 'target_inbox_id'],
      'additionalProperties': true,
    }
  settings_form_schema:
    [
      {
        'label': 'Page ID',
        'type': 'text',
        'name': 'page_id',
        'validation': 'required',
        'help': 'ID numérico da página Facebook/Instagram que enviará leads.',
      },
      {
        'label': 'Apelido da página',
        'type': 'text',
        'name': 'page_name',
        'help': 'Identificador para você (ex: Tozi Imobiliária).',
      },
      {
        'label': 'Verify Token',
        'type': 'text',
        'name': 'verify_token',
        'validation': 'required',
        'help': 'Use o MESMO valor aqui e no Meta Developers (Webhooks → Verify Token).',
      },
      {
        'label': 'App Secret',
        'type': 'text',
        'name': 'app_secret',
        'validation': 'required',
        'help': 'App Secret do app Meta (Settings → Basic). Usado para validar a assinatura HMAC.',
      },
      {
        'label': 'Page Access Token (preferível System User Token, não expira)',
        'type': 'textarea',
        'name': 'page_access_token',
        'validation': 'required',
        'help': 'Token com permissões: leads_retrieval, pages_show_list, pages_manage_metadata, pages_read_engagement.',
      },
      {
        'label': 'ID da Inbox alvo',
        'type': 'number',
        'name': 'target_inbox_id',
        'validation': 'required',
        'help': 'Inbox onde criar conversas a cada novo lead (ex: ID da inbox WAHA da Tozi).',
      },
      {
        'label': 'Mensagem inicial (Liquid template, opcional)',
        'type': 'textarea',
        'name': 'initial_message_template',
        'help': "Variáveis: {{full_name}}, {{first_name}}, {{ad_name}}, {{campaign_name}}, {{city}}, {{email}}. Usada em inbox WAHA (texto livre) e como espelho na transcrição. Se vazio, usa default em PT-BR.",
      },
      {
        'label': 'Template HSM (só inbox WhatsApp Cloud API oficial)',
        'type': 'text',
        'name': 'whatsapp_template_name',
        'help': 'Nome do template APROVADO na Meta (ex: tozi_lead_abertura). OBRIGATÓRIO quando a inbox alvo é Cloud API — texto livre é bloqueado fora da janela 24h. Ignorado em inbox WAHA.',
      },
      {
        'label': 'Idioma do template HSM',
        'type': 'text',
        'name': 'whatsapp_template_locale',
        'help': 'Locale do template aprovado. Padrão: pt_BR.',
      },
      {
        'label': 'Variáveis do corpo do HSM (campos do lead, em ordem)',
        'type': 'text',
        'name': 'whatsapp_template_body_fields',
        'help': 'Campos que preenchem {{1}}, {{2}}, ... na ordem, separados por vírgula. Opções: first_name, full_name, ad_name, campaign_name, city, email, phone. Padrão: first_name. Deixe vazio se o template não tem variáveis no corpo.',
      },
      {
        'label': 'Modo teste — não enviar 1ª mensagem',
        'type': 'checkbox',
        'name': 'skip_initial_message',
        'help': 'Marque enquanto está testando. SPX cria a conversa, mas NÃO envia a 1ª mensagem outgoing pro lead. Útil pra validar fluxo sem incomodar leads reais.',
      },
    ]
  visible_properties: ['page_name', 'page_id', 'target_inbox_id', 'skip_initial_message']
site_leads:
  id: site_leads
  logo: meta_lead_ads.png
  i18n_key: site_leads
  hook_type: account
  allow_multiple_hooks: true
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'site_name': { 'type': 'string' },
          'shared_secret': { 'type': 'string' },
          'target_inbox_id': { 'type': ['integer', 'string'] },
          'assign_team_id': { 'type': ['integer', 'string'] },
          'assign_agent_bot_id': { 'type': ['integer', 'string'] },
          'whatsapp_template_name': { 'type': 'string' },
          'whatsapp_template_locale': { 'type': 'string' },
          'whatsapp_template_body_fields': { 'type': 'string' },
          'default_ddd': { 'type': 'string' },
          'skip_initial_message': { 'type': 'boolean' },
          'enabled': { 'type': 'boolean' },
        },
      'required': ['shared_secret', 'target_inbox_id'],
      'additionalProperties': true,
    }
  settings_form_schema:
    [
      {
        'label': 'Apelido do site',
        'type': 'text',
        'name': 'site_name',
        'help': 'Identificador para você (ex: Site Tozi).',
      },
      {
        'label': 'Segredo compartilhado',
        'type': 'text',
        'name': 'shared_secret',
        'validation': 'required',
        'help': 'O site envia este valor no header X-SPX-Token. É ele que identifica a conta — use um valor longo e aleatório, e não reaproveite de outro lugar.',
      },
      {
        'label': 'ID da Inbox alvo',
        'type': 'number',
        'name': 'target_inbox_id',
        'validation': 'required',
        'help': 'Inbox WhatsApp onde a conversa do lead é aberta.',
      },
      {
        'label': 'ID do time',
        'type': 'number',
        'name': 'assign_team_id',
        'help': 'Time que recebe o lead já na criação (antes da abertura).',
      },
      {
        'label': 'ID do agente de IA (AgentBot)',
        'type': 'number',
        'name': 'assign_agent_bot_id',
        'help': 'Espelho AgentBot do assistente que atende estes leads. Precisa estar elegível à inbox alvo.',
      },
      {
        'label': 'Template HSM da abertura',
        'type': 'text',
        'name': 'whatsapp_template_name',
        'help': 'Nome do template APROVADO na Meta. OBRIGATÓRIO: quem preencheu formulário nunca escreveu, então a janela de 24h está fechada e texto livre é bloqueado.',
      },
      {
        'label': 'Idioma do template HSM',
        'type': 'text',
        'name': 'whatsapp_template_locale',
        'help': 'Locale do template aprovado. Padrão: pt_BR.',
      },
      {
        'label': 'Variáveis do corpo do HSM',
        'type': 'text',
        'name': 'whatsapp_template_body_fields',
        'help': "Campos que preenchem {{1}}, {{2}}, ... em ordem, separados por vírgula (first_name, full_name, city, email, phone). Escreva 'none' quando o template não tem variável no corpo — é o caso do opener genérico.",
      },
      {
        'label': 'DDD padrão',
        'type': 'text',
        'name': 'default_ddd',
        'help': 'Completa telefone digitado sem DDD (ex: 66). Sem isso, número sem DDD é descartado.',
      },
      {
        'label': 'Modo teste — não enviar 1ª mensagem',
        'type': 'checkbox',
        'name': 'skip_initial_message',
        'help': 'Cria a conversa mas NÃO envia a abertura. Útil pra validar o fluxo sem incomodar leads reais.',
      },
    ]
  visible_properties: ['site_name', 'target_inbox_id', 'skip_initial_message']
leadsquared:
  id: leadsquared
  feature_flag: crm_integration
  logo: leadsquared.png
  i18n_key: leadsquared
  action: /leadsquared
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'access_key': { 'type': 'string' },
          'secret_key': { 'type': 'string' },
          'endpoint_url': { 'type': 'string' },
          'app_url': { 'type': 'string' },
          'timezone': { 'type': 'string' },
          'enable_conversation_activity': { 'type': 'boolean' },
          'enable_transcript_activity': { 'type': 'boolean' },
          'conversation_activity_score': { 'type': 'string' },
          'transcript_activity_score': { 'type': 'string' },
          'conversation_activity_code': { 'type': 'integer' },
          'transcript_activity_code': { 'type': 'integer' },
        },
      'required': ['access_key', 'secret_key'],
      'additionalProperties': false,
    }
  settings_form_schema:
    [
      {
        'label': 'Access Key',
        'type': 'text',
        'name': 'access_key',
        'validation': 'required',
      },
      {
        'label': 'Secret Key',
        'type': 'text',
        'name': 'secret_key',
        'validation': 'required',
      },
      {
        'label': 'Push Conversation Activity',
        'type': 'checkbox',
        'name': 'enable_conversation_activity',
        'help': 'Enable this option to push an activity when a conversation is created',
      },
      {
        'label': 'Conversation Activity Score',
        'type': 'number',
        'name': 'conversation_activity_score',
        'help': 'Score to assign to the conversation created activity, default is 0',
      },
      {
        'label': 'Push Transcript Activity',
        'type': 'checkbox',
        'name': 'enable_transcript_activity',
        'help': 'Enable this option to push an activity when a transcript is created',
      },
      {
        'label': 'Transcript Activity Score',
        'type': 'number',
        'name': 'transcript_activity_score',
        'help': 'Score to assign to the conversation transcript activity, default is 0',
      },
    ]
  visible_properties:
    [
      'access_key',
      'endpoint_url',
      'enable_conversation_activity',
      'enable_transcript_activity',
      'conversation_activity_score',
      'transcript_activity_score',
    ]
