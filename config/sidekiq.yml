# Sample configuration file for Sidekiq.
# Options here can still be overridden by cmd line args.
# Place this file at config/sidekiq.yml and Sidekiq will
# pick it up automatically.
---
:verbose: false
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 15) %>
:timeout: 35
:max_retries: 5

# Sidekiq will run this file through ERB when reading it so you can
# even put in dynamic logic, like a host-specific queue.
# http://www.mikeperham.com/2013/11/13/advanced-sidekiq-host-specific-queues/
# https://github.com/sidekiq/sidekiq/wiki/Advanced-Options
# Since queues are declared without waits, the jobs in lower ranking queues will only be processed
# if there are no jobs in higher ranking queues.
:queues:
  - critical
  - high
  - medium
  - default
  - mailers
  - action_mailbox_routing
  - low
  - scheduled_jobs
  - deferred
  - purgable
  - housekeeping
  - async_database_migration
  - bulk_reindex_low
  - active_storage_analysis
  - active_storage_purge
  - action_mailbox_incineration

# O Sidekiq tem UM pool: prioridade estrita escolhe o proximo job, mas nao preempta o que ja
# esta rodando. Descricao de midia faz shell-out pro ffmpeg e, quando um quadro nao progride,
# segura a thread pelo tempo todo. Em homologacao 6 desses ocuparam 15 das 17 threads e a fila
# `critical` — que carrega o EventDispatcherJob do tempo real — acumulou 47 min de latencia.
# A capsula da a esse trabalho um pool proprio e pequeno: ele pode se atrasar, mas nao pode
# mais comer as threads de quem entrega evento ao painel.
:capsules:
  media:
    :concurrency: <%= ENV.fetch("SIDEKIQ_MEDIA_CONCURRENCY", 2) %>
    :queues:
      - media_processing

# you can override concurrency based on environment
production:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 15) %>
staging:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
