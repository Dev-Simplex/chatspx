# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
# keep the existing schedule key while the cron loader still uses load_from_hash
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  active_job: true
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  active_job: true
  queue: scheduled_jobs

# executed At every minute..
# Retoma os flows suspensos cujo wait venceu (no `wait` e timeout de `wait_for_reply`). O job existia
# desde a F2 e o flow_run.rb sempre afirmou que rodava "every minute", mas a entrada nunca foi criada.
flows_resume_job:
  cron: '*/1 * * * *'
  class: 'Flows::ResumeJob'
  active_job: true
  queue: scheduled_jobs

# De hora em hora.
# Agrega os flow_step_logs em FlowNodeStat e alimenta as pilulas "142 - 38%" do canvas. O job existe
# desde a Fase 3.3 e o proprio cabecalho dele diz "roda de hora em hora (config/schedule.yml)", mas a
# entrada nunca foi criada: por isso a .229 tinha 340 flow_step_logs e 0 flow_node_stats. E idempotente
# por construcao (recomputa o total e faz upsert com SET, nao incremento).
flows_stats_rollup_job:
  cron: '0 * * * *'
  class: 'Flows::StatsRollupJob'
  active_job: true
  queue: scheduled_jobs

# A cada 5 minutos.
# Vence as designacoes paradas do Motor de Distribuicao e repassa ao proximo do rodizio (ou
# escala ao responsavel fixo). NO-OP enquanto nenhuma politica tiver `repasse_automatico`
# ligado -- o default e false, entao ligar o job nao muda nada em conta nenhuma.
spx_distribuicao_varrer_sla_job:
  cron: '*/5 * * * *'
  class: 'Spx::Distribuicao::VarrerSlaJob'
  active_job: true
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  active_job: true
  queue: scheduled_jobs

# executed every minute
# engine de disparo de campanhas WhatsApp (HSM): despacha o proximo lote de
# campaign_recipients pendentes respeitando pacing/quiet-hours/health-gate.
# NO-OP quando nao ha campanha em dispatch_status=running.
campaigns_whatsapp_dispatch_job:
  cron: '*/1 * * * *'
  class: 'Campaigns::Whatsapp::DispatchSchedulerJob'
  active_job: true
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  active_job: true
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  active_job: true
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  active_job: true
  queue: scheduled_jobs

# executed every 15 minutes
# to assign unassigned conversations for all inboxes
bulk_auto_assignment_job:
  cron: '*/15 * * * *'
  class: 'Inboxes::BulkAutoAssignmentJob'
  active_job: true
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  active_job: true
  queue: scheduled_jobs

# executed every 30 minutes (em :00 e :30)
# refresh WAHA groups to populate LID to phone number mappings
# queue movida de :low (faminta) para :scheduled_jobs — em producao carregada a :low
# quase nunca drenava e o cache LID->PN nao era aquecido.
waha_refresh_groups_job:
  cron: '*/30 * * * *'
  class: 'Waha::RefreshGroupsJob'
  active_job: true
  queue: scheduled_jobs

# executed every hour at :15 (logo apos o refresh de grupos das :00 aquecer o cache)
# rede de seguranca: reenfileira a resolucao dos @lid presos (dead-letter). Conserta o
# caso da migracao de servidor WAHA, em que o cache LID->PN zera e os ResolveLidJob
# morrem sem reagendamento. Idempotente; enfileira em :scheduled_jobs (nao :high).
waha_resolve_lid_sweep_job:
  cron: '15 * * * *'
  class: 'Contacts::ResolveLidSweepJob'
  active_job: true
  queue: scheduled_jobs

# executed every 5 minutes
# safety net for WAHA freeze #1482: re-inject inbound messages that never
# reached Chatwoot. NO-OP unless ENV WAHA_RECONCILER_ENABLED is truthy.
# Enable in homologacao first — can duplicate messages if dedup fails.
waha_inbound_reconciler_job:
  cron: '*/5 * * * *'
  class: 'Waha::InboundReconcilerJob'
  active_job: true
  queue: low

# executed weekly on Sunday at 03:00 UTC
# purge orphan ActiveStorage blobs (no attachment, older than 7 days)
purge_orphan_blobs_job:
  cron: '0 3 * * 0'
  class: 'Internal::PurgeOrphanBlobsJob'
  active_job: true
  queue: housekeeping

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  active_job: true
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  active_job: true
  queue: housekeeping

# executed every 5 minutes
# vigia de órfãs (D-12): contas com modo "Atribuição obrigatória"
# (reply_assignment_gate). Fan-out p/ OrphanRetriageJob.
conversations_orphan_watch_job:
  cron: '*/5 * * * *'
  class: 'Account::OrphanConversationsWatchJob'
  active_job: true
  queue: scheduled_jobs
# executed every 5 minutes
# repasse por SLA no modo ASSIGNEE (locação): a pessoa já é dona e o prazo mede "não respondeu
# ao cliente". O modo `designacao` NÃO passa por aqui — quem varre aquele é o
# spx_distribuicao_varrer_sla_job, acima; os dois olhando o mesmo modo repassariam cada lead
# duas vezes. Inerte enquanto nenhuma política tiver `repasse_automatico` (o default é false),
# e inerte em time sem expediente configurado — o relógio do SLA só anda dentro do horário.
distribuicao_repasse_job:
  cron: '*/5 * * * *'
  class: 'Spx::Distribuicao::RepasseJob'
  active_job: true
  queue: scheduled_jobs
# executed every 5 minutes
# avisos automáticos (lead parado, meta batida) nas salas de time que ligaram algum
internal_channels_auto_alerts_job:
  cron: '*/5 * * * *'
  class: 'InternalChannels::AutoAlertsJob'
  active_job: true
  queue: scheduled_jobs
# executed daily at 0400 UTC
# purge expired bulk media downloads (zip blob + record) after 7-day retention
purge_expired_bulk_downloads_job:
  cron: '0 4 * * *'
  class: 'Attachments::PurgeBulkDownloadsJob'
  active_job: true
  queue: housekeeping

# executed hourly (minuto 7 p/ evitar o topo da hora)
# eval LLM-as-a-Judge: avalia atendimentos (IA e humanos) das contas com
# custom_attributes['eval_enabled']. NO-OP nas contas sem a flag.
captain_conversation_eval_scheduler_job:
  cron: '7 * * * *'
  class: 'Captain::ConversationEvalSchedulerJob'
  active_job: true
  queue: scheduled_jobs

# executado uma vez por dia, 11h UTC (8h em Brasília) — o aviso chega no começo do
# expediente. NO-OP quando nenhuma regra de agenda tem lembrete configurado.
units_schedule_reminder_job:
  cron: '0 11 * * *'
  class: 'Units::ScheduleReminderJob'
  active_job: true
  queue: scheduled_jobs

# uma vez por dia, 10h UTC: põe os feriados nacionais na unidade que ainda não os tem e
# completa o ano novo das datas móveis. NO-OP quando todas as unidades já estão em dia.
units_feriados_nacionais_job:
  cron: '0 10 * * *'
  class: 'Units::FeriadosNacionaisJob'
  active_job: true
  queue: scheduled_jobs

# digest diário do eval: leva as conversas com falha GRAVE da IA pra uma lista explícita de
# e-mails, por conta. Sem custom_attributes['eval_digest']['enabled'] a conta não recebe nada.
# Existe porque o eval detecta em volume e o resultado morria no painel: numa conta medida em
# 28/08/2026 eram 380 conversas com finding grave em 30 dias e nenhuma ação registrada.
# O horário é do FUSO DO PROCESSO, não UTC: o sidekiq-cron agenda no `Time.zone` da aplicação
# (aqui America/Manaus, UTC-4). O comentário anterior dizia "11h UTC = 7h em Cuiabá" e estava
# errado nos dois sentidos — `0 11` disparava às 11h da manhã do cliente, não às 7h, e foi
# assim que ele recebeu por três dias seguidos.
spx_eval_digest_scheduler_job:
  cron: '0 7 * * *'
  class: 'Spx::EvalDigestSchedulerJob'
  active_job: true
  queue: scheduled_jobs
